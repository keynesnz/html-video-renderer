name: Render MP4

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check FFmpeg
        run: |
          ffmpeg -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone renderer
        run: |
          git clone \
            https://github.com/dtinth/html5-animation-video-renderer.git \
            renderer

      - name: Install renderer
        working-directory: renderer
        run: |
          corepack enable
          yarn install

      - name: Render
        working-directory: renderer
        run: |
          node render \
            --url=file://${{ github.workspace }}/index.html \
            --video=${{ github.workspace }}/output.mp4 \
            --parallelism=1

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output.mp4
