name: Render MP4

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check required files
        run: |
          test -f source.html || {
            echo "::error::source.html not found"
            exit 1
          }

          test -f render.js || {
            echo "::error::render.js not found"
            exit 1
          }

          test -f index.html || {
            echo "::error::index.html not found"
            exit 1
          }

      - name: Create package.json if missing
        run: |
          if [ ! -f package.json ]; then
            cat > package.json <<'EOF'
          {
            "name": "html-video-renderer",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "render": "node render.js"
            },
            "dependencies": {
              "puppeteer": "^24.15.0"
            }
          }
          EOF
          fi

      - name: Install Node dependencies
        run: |
          npm install puppeteer@24.15.0

      - name: Install Chromium
        run: |
          npx puppeteer browsers install chrome

      - name: Create video filename
        run: |
          VIDEO_NAME="$(
            TZ=America/Chicago date '+%B-%d-%Y_%H-%M-%S'
          ).mp4"

          echo "VIDEO_NAME=$VIDEO_NAME" >> "$GITHUB_ENV"

      - name: Render video
        env:
          INPUT: source.html
          OUTPUT: ${{ env.VIDEO_NAME }}
        run: |
          node render.js

      - name: Check rendered video
        run: |
          if [ ! -f "$VIDEO_NAME" ]; then
            echo "::error::Video was not created"
            exit 1
          fi

          if [ ! -s "$VIDEO_NAME" ]; then
            echo "::error::Video file is empty"
            exit 1
          fi

          echo "Created video:"
          ls -lh "$VIDEO_NAME"

          ffprobe \
            -v error \
            -show_entries \
            "format=duration,size:stream=width,height,r_frame_rate,codec_name,pix_fmt" \
            -of default=noprint_wrappers=1 \
            "$VIDEO_NAME"

      - name: Prepare Pages
        run: |
          rm -rf pages
          mkdir -p pages/videos

          cp index.html pages/index.html
          cp "$VIDEO_NAME" "pages/videos/$VIDEO_NAME"

          echo "$VIDEO_NAME" > pages/videos/latest.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
