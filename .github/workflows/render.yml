name: Render MP4

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install

      - name: Create video filename
        run: |
          DATE=$(TZ=Asia/Jakarta date '+%B-%d-%Y_%H-%M')
          echo "VIDEO_NAME=${DATE}.mp4" >> "$GITHUB_ENV"
          echo "Video filename: ${DATE}.mp4"

      - name: Render MP4
        run: |
          OUTPUT="$VIDEO_NAME" node render.js

      - name: Check MP4
        run: |
          ls -lh "$VIDEO_NAME"

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=width,height,r_frame_rate,codec_name \
            -of default=noprint_wrappers=1 \
            "$VIDEO_NAME"

      - name: Prepare Pages
        run: |
          mkdir -p pages

          cp "$VIDEO_NAME" "pages/$VIDEO_NAME"

cat > pages/index.html <<EOF
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Video Renderer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .container {
      width: min(700px, 100%);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      margin-bottom: 30px;
    }

    video {
      width: 100%;
      max-height: 70vh;
      background: #000;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 8px;
      background: white;
      color: black;
      text-decoration: none;
      font-weight: bold;
    }

    .button:hover {
      opacity: 0.85;
    }

    .status {
      margin-top: 20px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

<main class="container">

  <h1>HTML Video Renderer</h1>

  <p>Latest rendered video</p>

  <video controls preload="metadata">
    <source
      src="./$VIDEO_NAME"
      type="video/mp4"
    >
  </video>

  <br>

  <a
    class="button"
    href="./$VIDEO_NAME"
    download="$VIDEO_NAME"
  >
    Download MP4
  </a>

  <div class="status">
    $VIDEO_NAME
  </div>

</main>

</body>
</html>
EOF

          echo "Published:"
          echo "$VIDEO_NAME"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
