name: Render MP4

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # INSTALL FFMPEG
      # ==================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "FFmpeg:"
          ffmpeg -version


      # ==================================================
      # NODE
      # ==================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ==================================================
      # INSTALL DEPENDENCIES
      # ==================================================

      - name: Install dependencies
        run: |
          npm install


      # ==================================================
      # CHECK PUPPETEER
      # ==================================================

      - name: Check Puppeteer
        run: |
          node - <<'NODE'
          const puppeteer = require("puppeteer");

          console.log(
            "Chromium executable:"
          );

          console.log(
            puppeteer.executablePath()
          );
          NODE


      # ==================================================
      # CHECK SOURCE HTML
      # ==================================================

      - name: Check source HTML
        run: |

          if [ ! -f source.html ]; then

            echo "ERROR:"
            echo "source.html was not found."

            exit 1

          fi

          echo "source.html found."

          ls -lh source.html


      # ==================================================
      # CREATE TIMESTAMP
      #
      # Kansas City / Central Time
      #
      # Example:
      #
      # August-14-2026_00-52-31.mp4
      # ==================================================

      - name: Create video filename
        run: |

          VIDEO_NAME=$(
            TZ=America/Chicago \
            date '+%B-%d-%Y_%H-%M-%S'
          ).mp4

          echo \
            "VIDEO_NAME=$VIDEO_NAME" \
            >> "$GITHUB_ENV"

          echo ""
          echo "================================"
          echo "VIDEO:"
          echo "$VIDEO_NAME"
          echo "================================"


      # ==================================================
      # RENDER
      # ==================================================

      - name: Render MP4
        run: |

          INPUT="source.html" \
          OUTPUT="$VIDEO_NAME" \
          node render.js


      # ==================================================
      # CHECK OUTPUT
      # ==================================================

      - name: Check MP4
        run: |

          if [ ! -f "$VIDEO_NAME" ]; then

            echo "ERROR:"
            echo "MP4 was not created."

            exit 1

          fi

          echo ""
          echo "MP4 created:"
          ls -lh "$VIDEO_NAME"

          echo ""
          echo "Video information:"

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=width,height,r_frame_rate,codec_name \
            -of default=noprint_wrappers=1 \
            "$VIDEO_NAME"


      # ==================================================
      # PREPARE GITHUB PAGES
      #
      # IMPORTANT:
      #
      # We COPY the existing repository index.html.
      #
      # We DO NOT create a new index.html.
      # ==================================================

      - name: Prepare Pages
        run: |

          rm -rf pages

          mkdir -p pages


          # ----------------------------------------------
          # Copy dashboard
          # ----------------------------------------------

          if [ ! -f index.html ]; then

            echo "ERROR:"
            echo "Dashboard index.html is missing."

            exit 1

          fi

          cp index.html pages/index.html


          # ----------------------------------------------
          # Create videos directory
          # ----------------------------------------------

          mkdir -p pages/videos


          # ----------------------------------------------
          # Copy newest MP4
          # ----------------------------------------------

          cp \
            "$VIDEO_NAME" \
            "pages/videos/$VIDEO_NAME"


          # ----------------------------------------------
          # Save latest filename
          #
          # Dashboard can read this if needed.
          # ----------------------------------------------

          echo "$VIDEO_NAME" \
            > pages/videos/latest.txt


          # ----------------------------------------------
          # Show final Pages structure
          # ----------------------------------------------

          echo ""
          echo "================================"
          echo "PAGES CONTENT"
          echo "================================"

          find pages \
            -maxdepth 3 \
            -type f \
            -printf '%p\n'


      # ==================================================
      # CONFIGURE GITHUB PAGES
      # ==================================================

      - name: Setup Pages
        uses: actions/configure-pages@v5


      # ==================================================
      # UPLOAD PAGES ARTIFACT
      # ==================================================

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages


      # ==================================================
      # DEPLOY
      # ==================================================

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
