name: Render video

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create timestamp filename
        run: |
          VIDEO_NAME="$(TZ=America/Chicago date '+%B-%d-%Y_%H-%M-%S').mp4"
          echo "VIDEO_NAME=$VIDEO_NAME" >> "$GITHUB_ENV"
          echo "Video will be saved as: $VIDEO_NAME"

      - name: Render video
        run: |
          node render.js

          if [ ! -f output.mp4 ]; then
            echo "::error::render.js did not create output.mp4"
            echo "Files created:"
            find . -maxdepth 3 -type f -ls
            exit 1
          fi

          mv output.mp4 "$VIDEO_NAME"

      - name: Validate video
        run: |
          if [ ! -f "$VIDEO_NAME" ]; then
            echo "::error::Video was not created: $VIDEO_NAME"
            exit 1
          fi

          if [ ! -s "$VIDEO_NAME" ]; then
            echo "::error::Video file is empty: $VIDEO_NAME"
            exit 1
          fi

          echo "Created video:"
          ls -lh "$VIDEO_NAME"

          ffprobe \
            -v error \
            -show_entries \
            "format=duration,size:stream=width,height,r_frame_rate,codec_name,pix_fmt" \
            -of default=noprint_wrappers=1 \
            "$VIDEO_NAME"

      - name: Prepare GitHub Pages files
        run: |
          rm -rf pages
          mkdir -p pages/videos

          cp index.html pages/index.html
          cp "$VIDEO_NAME" "pages/videos/$VIDEO_NAME"

          echo "$VIDEO_NAME" > pages/videos/latest.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
