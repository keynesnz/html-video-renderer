name: Render MP4

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone renderer
        run: |
          git clone \
            https://github.com/dtinth/html5-animation-video-renderer.git \
            renderer

      - name: Install renderer
        working-directory: renderer
        run: |
          corepack enable
          yarn install

      - name: Patch Puppeteer sandbox
        working-directory: renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(
              Path("src").rglob("*.js")
          ) + list(
              Path(".").glob("*.js")
          )

          found = False

          for file in files:
              if "node_modules" in file.parts:
                  continue

              text = file.read_text()

              if "puppeteer.launch" not in text:
                  continue

              print("Patching:", file)

              old = "puppeteer.launch({"

              new = """puppeteer.launch({
            args: [
              "--no-sandbox",
              "--disable-setuid-sandbox",
              "--disable-dev-shm-usage"
            ],"""

              if old in text:
                  text = text.replace(
                      old,
                      new,
                      1
                  )

                  file.write_text(text)
                  found = True

          if not found:
              print("Could not find puppeteer.launch in source files.")
              print("Searching entire project...")

              for file in Path(".").rglob("*.js"):
                  if "node_modules" in file.parts:
                      continue

                  try:
                      text = file.read_text()
                  except:
                      continue

                  if "puppeteer.launch" in text:
                      print("FOUND:", file)

              raise SystemExit(1)

          print("Puppeteer sandbox patch complete.")

      - name: Verify patch
        working-directory: renderer
        run: |
          grep -RIn \
            --exclude-dir=node_modules \
            "no-sandbox" \
            . || true

      - name: Render
        working-directory: renderer
        run: |
          node render \
            --url=file://${{ github.workspace }}/index.html \
            --video=${{ github.workspace }}/output.mp4 \
            --parallelism=1

      - name: Check output
        run: |
          ls -lh output.mp4
          ffprobe output.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output.mp4
