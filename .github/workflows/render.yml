name: Render MP4

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  render:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -version


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Install dependencies
        run: |
          npm install


      - name: Check Puppeteer
        run: |
          node - <<'NODE'
          const puppeteer = require("puppeteer");

          console.log(
            "Chromium:"
          );

          console.log(
            puppeteer.executablePath()
          );
          NODE


      - name: Create video filename
        run: |

          VIDEO_NAME=$(
            TZ=America/Chicago \
            date '+%B-%d-%Y_%H-%M-%S'
          ).mp4

          echo \
            "VIDEO_NAME=$VIDEO_NAME" \
            >> "$GITHUB_ENV"

          echo ""
          echo "Video:"
          echo "$VIDEO_NAME"


      - name: Check source HTML
        run: |

          if [ ! -f source.html ]; then

            echo "ERROR:"
            echo "source.html does not exist."

            exit 1

          fi

          echo "Source HTML:"
          ls -lh source.html


      - name: Render MP4
        run: |

          INPUT="source.html" \
          OUTPUT="$VIDEO_NAME" \
          node render.js


      - name: Check MP4
        run: |

          ls -lh "$VIDEO_NAME"

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=width,height,r_frame_rate,codec_name \
            -of default=noprint_wrappers=1 \
            "$VIDEO_NAME"


      - name: Prepare Pages
        run: |

          rm -rf pages

          mkdir -p pages


          #
          # Copy newest video
          #

          cp \
            "$VIDEO_NAME" \
            "pages/$VIDEO_NAME"


          #
          # Create viewer page
          #

          cat > pages/index.html <<EOF

          <!DOCTYPE html>

          <html lang="en">

          <head>

            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >

            <title>
              HTML Video Renderer
            </title>

            <style>

              * {
                box-sizing: border-box;
              }

              html,
              body {
                margin: 0;
                padding: 0;

                min-height: 100%;

                font-family:
                  Arial,
                  Helvetica,
                  sans-serif;

                background: #111;

                color: white;
              }

              body {

                min-height: 100vh;

                display: flex;

                justify-content: center;

                align-items: center;

                padding: 24px;

              }

              .container {

                width: 100%;

                max-width: 720px;

                text-align: center;

              }

              h1 {

                margin:
                  0 0 10px;

              }

              p {

                color: #999;

              }

              video {

                display: block;

                width: 100%;

                max-height: 75vh;

                background: #000;

                border-radius: 12px;

              }

              .buttons {

                display: flex;

                justify-content: center;

                gap: 12px;

                flex-wrap: wrap;

                margin-top: 22px;

              }

              a {

                display: inline-block;

                padding:
                  13px 22px;

                border-radius: 8px;

                background: white;

                color: #111;

                text-decoration: none;

                font-weight: bold;

              }

              a.secondary {

                background: #333;

                color: white;

              }

              .filename {

                margin-top: 18px;

                color: #666;

                font-size: 13px;

                word-break:
                  break-all;

              }

            </style>

          </head>


          <body>

            <main
              class="container"
            >

              <h1>
                Latest Render
              </h1>

              <p>
                $VIDEO_NAME
              </p>


              <video
                controls
                preload="metadata"
                playsinline
              >

                <source
                  src="./$VIDEO_NAME"
                  type="video/mp4"
                >

              </video>


              <div
                class="buttons"
              >

                <a
                  href="./$VIDEO_NAME"
                  download="$VIDEO_NAME"
                >
                  Download MP4
                </a>


                <a
                  class="secondary"
                  href="./$VIDEO_NAME"
                  target="_blank"
                  rel="noopener"
                >
                  Open Video
                </a>

              </div>

            </main>

          </body>

          </html>

          EOF


      - name: Setup Pages
        uses: actions/configure-pages@v5


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages


      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
