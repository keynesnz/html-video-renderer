<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full Screen Branching Lightning</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #030106;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <canvas id="wallpaper"></canvas>

  <script>
    const canvas = document.getElementById("wallpaper");
    const ctx = canvas.getContext("2d", {
      alpha: false,
      colorSpace: "srgb"
    });

    const WIDTH = 2160;
    const HEIGHT = 3840;
    const TOTAL_DURATION = 15000;

    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    let activeBolts = [];
    let lightningFlash = 0;
    let lastStrike = -2000;
    let nextStrike = random(250, 900);
    let startTime = performance.now();

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomInt(min, max) {
      return Math.floor(random(min, max + 1));
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function drawBackground(time) {
      const pulse = Math.sin(time * 0.0014) * 0.5 + 0.5;

      const bg = ctx.createRadialGradient(
        WIDTH * 0.5,
        HEIGHT * 0.3,
        0,
        WIDTH * 0.5,
        HEIGHT * 0.48,
        HEIGHT * 0.95
      );

      bg.addColorStop(0, "#702449");
      bg.addColorStop(0.2, "#481532");
      bg.addColorStop(0.42, "#260d28");
      bg.addColorStop(0.7, "#100514");
      bg.addColorStop(1, "#020105");

      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      const glow = ctx.createRadialGradient(
        WIDTH * 0.5,
        HEIGHT * 0.15,
        0,
        WIDTH * 0.5,
        HEIGHT * 0.15,
        WIDTH * (0.48 + pulse * 0.13)
      );

      glow.addColorStop(0, "rgba(255, 76, 170, 0.3)");
      glow.addColorStop(0.4, "rgba(143, 24, 100, 0.15)");
      glow.addColorStop(1, "rgba(20, 0, 20, 0)");

      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      const lowerGlow = ctx.createRadialGradient(
        WIDTH * 0.7,
        HEIGHT * 0.8,
        0,
        WIDTH * 0.7,
        HEIGHT * 0.8,
        WIDTH * 0.75
      );

      lowerGlow.addColorStop(0, "rgba(115, 24, 92, 0.28)");
      lowerGlow.addColorStop(0.5, "rgba(52, 9, 50, 0.15)");
      lowerGlow.addColorStop(1, "rgba(0, 0, 0, 0)");

      ctx.fillStyle = lowerGlow;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      if (lightningFlash > 0) {
        ctx.fillStyle = `rgba(255, 210, 240, ${lightningFlash})`;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }
    }

    function createMainBolt(startX, startY, endX, endY) {
      const points = [];
      const segments = randomInt(13, 21);

      let x = startX;
      let y = startY;

      points.push({ x, y });

      for (let i = 1; i <= segments; i++) {
        const progress = i / segments;

        x += random(-175, 175);
        y = startY + (endY - startY) * progress;

        points.push({ x, y });
      }

      points[points.length - 1] = {
        x: endX,
        y: endY
      };

      return points;
    }

    function createBranch(parentPoints, startIndex, direction, depth = 0) {
      if (
        depth > 2 ||
        startIndex >= parentPoints.length - 2
      ) {
        return null;
      }

      const origin = parentPoints[startIndex];
      const points = [{ x: origin.x, y: origin.y }];

      let x = origin.x;
      let y = origin.y;

      const steps = randomInt(3, 7);
      const branchLength = random(220, 700);

      for (let i = 1; i <= steps; i++) {
        const progress = i / steps;

        x += direction * random(35, 150);
        y += branchLength / steps;

        points.push({
          x,
          y
        });

        // Membuat cabang kecil dari cabang utama
        if (
          depth < 2 &&
          i > 1 &&
          Math.random() < 0.48
        ) {
          const smallBranch = createBranch(
            points,
            i - 1,
            Math.random() > 0.5 ? 1 : -1,
            depth + 1
          );

          if (smallBranch) {
            points.push({
              childBranch: smallBranch
            });
          }
        }
      }

      return points;
    }

    function drawPath(
      points,
      width,
      alpha,
      color,
      shadow
    ) {
      if (!points || points.length < 2) return;

      ctx.save();

      ctx.globalAlpha = alpha;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = width;
      ctx.strokeStyle = color;
      ctx.shadowColor = shadow;
      ctx.shadowBlur = width * 11;

      ctx.beginPath();

      let started = false;

      for (const point of points) {
        if (point.childBranch) {
          drawPath(
            point.childBranch,
            width * 0.55,
            alpha * 0.8,
            color,
            shadow
          );
          continue;
        }

        if (!started) {
          ctx.moveTo(point.x, point.y);
          started = true;
        } else {
          ctx.lineTo(point.x, point.y);
        }
      }

      ctx.stroke();
      ctx.restore();
    }

    function drawAllBranches(points, intensity, depth = 0) {
      if (!points || depth > 2) return;

      for (let i = 1; i < points.length - 2; i++) {
        if (
          Math.random() < 0.34 ||
          i === 3 ||
          i === 6 ||
          i === 9
        ) {
          const direction =
            Math.random() > 0.5 ? 1 : -1;

          const branch = createBranch(
            points,
            i,
            direction,
            depth
          );

          if (!branch) continue;

          drawPath(
            branch,
            30,
            intensity * 0.2,
            "rgba(219, 23, 157, 0.9)",
            "rgba(255, 0, 190, 1)"
          );

          drawPath(
            branch,
            10,
            intensity * 0.7,
            "rgba(255, 98, 211, 1)",
            "rgba(255, 70, 210, 1)"
          );

          drawPath(
            branch,
            3,
            intensity,
            "#fff8ff",
            "#ffffff"
          );
        }
      }
    }

    function createStrike(time) {
      const startX = random(-WIDTH * 0.15, WIDTH * 1.15);
      const startY = random(-500, HEIGHT * 0.12);

      const endX = clamp(
        startX + random(-1100, 1100),
        -WIDTH * 0.2,
        WIDTH * 1.2
      );

      const endY = random(
        HEIGHT * 0.28,
        HEIGHT * 0.96
      );

      const points = createMainBolt(
        startX,
        startY,
        endX,
        endY
      );

      activeBolts.push({
        points,
        createdAt: time,
        duration: random(430, 850),
        branchesDrawn: false
      });

      lightningFlash = Math.max(
        lightningFlash,
        random(0.12, 0.24)
      );
    }

    function drawLightning(time) {
      for (let i = activeBolts.length - 1; i >= 0; i--) {
        const bolt = activeBolts[i];
        const progress =
          (time - bolt.createdAt) / bolt.duration;

        if (progress >= 1) {
          activeBolts.splice(i, 1);
          continue;
        }

        let intensity;

        if (progress < 0.12) {
          intensity = progress / 0.12;
        } else {
          intensity = 1 - (progress - 0.12) / 0.88;
        }

        intensity = clamp(intensity, 0, 1);

        // Aura luar
        drawPath(
          bolt.points,
          125,
          intensity * 0.13,
          "rgba(183, 13, 125, 0.9)",
          "rgba(255, 0, 180, 1)"
        );

        // Glow merah muda
        drawPath(
          bolt.points,
          58,
          intensity * 0.35,
          "rgba(255, 20, 160, 0.95)",
          "rgba(255, 20, 180, 1)"
        );

        // Lapisan terang
        drawPath(
          bolt.points,
          21,
          intensity * 0.9,
          "rgba(255, 119, 222, 1)",
          "rgba(255, 70, 210, 1)"
        );

        // Inti putih
        drawPath(
          bolt.points,
          5,
          intensity,
          "#fffaff",
          "#ffffff"
        );

        if (
          !bolt.branchesDrawn &&
          progress < 0.5
        ) {
          drawAllBranches(
            bolt.points,
            intensity
          );

          bolt.branchesDrawn = true;
        }

        lightningFlash = Math.max(
          lightningFlash,
          intensity * 0.035
        );
      }
    }

    function drawClouds(time) {
      ctx.save();
      ctx.globalAlpha = 0.045;

      for (let i = 0; i < 12; i++) {
        const x =
          ((time * (0.012 + i * 0.002) + i * 470) %
            (WIDTH + 1100)) -
          550;

        const y = HEIGHT * (0.08 + i * 0.085);

        const cloud = ctx.createRadialGradient(
          x,
          y,
          0,
          x,
          y,
          random(300, 750)
        );

        cloud.addColorStop(0, "#ff8dde");
        cloud.addColorStop(1, "rgba(0, 0, 0, 0)");

        ctx.fillStyle = cloud;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }

      ctx.restore();
    }

    function drawVignette() {
      const vignette = ctx.createRadialGradient(
        WIDTH / 2,
        HEIGHT / 2,
        WIDTH * 0.12,
        WIDTH / 2,
        HEIGHT / 2,
        HEIGHT * 0.78
      );

      vignette.addColorStop(0, "rgba(0, 0, 0, 0)");
      vignette.addColorStop(0.58, "rgba(0, 0, 0, 0.1)");
      vignette.addColorStop(0.8, "rgba(0, 0, 0, 0.48)");
      vignette.addColorStop(1, "rgba(0, 0, 0, 0.95)");

      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
    }

    function drawGrain() {
      ctx.save();
      ctx.globalAlpha = 0.025;

      for (let i = 0; i < 2300; i++) {
        const x = Math.random() * WIDTH;
        const y = Math.random() * HEIGHT;
        const size = random(1, 4);

        ctx.fillStyle =
          Math.random() > 0.5
            ? "#ffb7e6"
            : "#000000";

        ctx.fillRect(x, y, size, size);
      }

      ctx.restore();
    }

    function drawFrame(elapsed) {
      lightningFlash *= 0.84;

      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      drawBackground(elapsed);
      drawClouds(elapsed);

      if (
        elapsed - lastStrike > nextStrike &&
        elapsed < TOTAL_DURATION
      ) {
        const strikeCount =
          Math.random() < 0.25 ? 2 : 1;

        for (let i = 0; i < strikeCount; i++) {
          createStrike(elapsed);
        }

        lastStrike = elapsed;
        nextStrike = random(350, 1150);
      }

      drawLightning(elapsed);
      drawVignette();
      drawGrain();
    }

    function animate(now) {
      const elapsed = now - startTime;

      drawFrame(elapsed);

      if (
        elapsed < TOTAL_DURATION ||
        activeBolts.length > 0
      ) {
        requestAnimationFrame(animate);
      } else {
        drawFrame(TOTAL_DURATION);
      }
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
