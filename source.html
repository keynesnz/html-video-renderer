<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Text Animation</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #050505;
        font-family: Arial, sans-serif;
    }

    .text {
        font-size: clamp(40px, 10vw, 100px);
        font-weight: 800;
        color: white;
        letter-spacing: 5px;

        /* Animation */
        animation:
            slideIn 1.2s ease-out forwards,
            glow 2s ease-in-out 1.2s infinite alternate;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(80px);
            filter: blur(15px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }
    }

    @keyframes glow {
        from {
            text-shadow:
                0 0 5px #00ffff,
                0 0 10px #00ffff;
        }

        to {
            text-shadow:
                0 0 10px #00ffff,
                0 0 30px #00ffff,
                0 0 60px #0088ff;
        }
    }
</style>
</head>

<body>

    <h1 class="text">HELLO WORLD</h1>

</body>
</html>
