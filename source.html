<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mobile Premium Ad</title>

  <style>
    :root {
      --cyan: #5ce7ff;
      --blue: #658dff;
      --text: #f5f8ff;
      --muted: #8994aa;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #010207;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: 14px;
    }

    /* Phone outer frame */
    .phone {
      position: relative;
      width: min(92vw, 430px);
      height: min(94svh, 860px);
      aspect-ratio: 6 / 19;
      padding: 8px;
      border-radius: 42px;
      background:
        linear-gradient(145deg, #414753, #080a10 35%, #272d3a 75%, #090b11);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.3),
        0 25px 80px rgba(0, 0, 0, 0.8),
        0 0 70px rgba(70, 141, 255, 0.18);
    }

    /* Phone screen */
    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 35px;
      background:
        radial-gradient(
          circle at 50% 34%,
          rgba(68, 128, 255, 0.23),
          transparent 27%
        ),
        radial-gradient(
          circle at 15% 100%,
          rgba(127, 71, 255, 0.2),
          transparent 35%
        ),
        linear-gradient(160deg, #05070d, #090e1a 50%, #020307);
    }

    /* Phone camera / notch */
    .notch {
      position: absolute;
      z-index: 10;
      top: 9px;
      left: 50%;
      width: 105px;
      height: 25px;
      transform: translateX(-50%);
      border-radius: 20px;
      background: #010207;
      box-shadow: inset 0 -1px 2px rgba(255, 255, 255, 0.1);
    }

    .notch::after {
      content: "";
      position: absolute;
      top: 9px;
      right: 20px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #1e314d;
      box-shadow: 0 0 8px #4c8aff;
    }

    /* Decorative grid */
    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }

    /* Animated light sweep */
    .screen::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: -20%;
      left: -80%;
      width: 45%;
      height: 150%;
      transform: rotate(24deg);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.12),
        rgba(87, 219, 255, 0.7),
        rgba(255, 255, 255, 0.1),
        transparent
      );
      filter: blur(10px);
      animation: sweep 4.8s ease-in-out infinite;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100%;
      padding: 70px 28px 40px;
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 18px;
      color: var(--cyan);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.2em;
      line-height: 1.5;
      text-transform: uppercase;
      animation: rise 0.8s 0.1s both;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(56px, 17vw, 98px);
      font-weight: 850;
      letter-spacing: -0.09em;
      line-height: 0.82;
      animation: rise 0.8s 0.25s both;
    }

    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(
        135deg,
        #ffffff,
        #9fdcff 44%,
        #687eff
      );
      background-clip: text;
      -webkit-background-clip: text;
      filter: drop-shadow(0 0 22px rgba(86, 184, 255, 0.25));
    }

    .description {
      max-width: 275px;
      margin: 25px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      animation: rise 0.8s 0.4s both;
    }

    .orb {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 38px auto 35px;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(74, 219, 255, 0.7), transparent 35%),
        radial-gradient(circle, rgba(91, 101, 255, 0.4), transparent 66%);
      box-shadow:
        0 0 40px rgba(76, 210, 255, 0.4),
        0 0 100px rgba(90, 100, 255, 0.25);
      animation: float 4s ease-in-out infinite;
    }

    .orb::before,
    .orb::after {
      content: "";
      position: absolute;
      inset: 17px;
      border: 1px solid rgba(152, 226, 255, 0.6);
      border-radius: 50%;
      transform: rotate(35deg) scaleX(1.8);
    }

    .orb::after {
      transform: rotate(-35deg) scaleX(1.8);
      opacity: 0.55;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 21px;
      color: white;
      border: 1px solid rgba(106, 220, 255, 0.65);
      background: rgba(255, 255, 255, 0.06);
      box-shadow:
        inset 0 0 25px rgba(68, 181, 255, 0.13),
        0 0 25px rgba(68, 181, 255, 0.16);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      animation: rise 0.8s 0.55s both;
    }

    .button::before {
      content: "";
      width: 7px;
      height: 7px;
      margin-right: 12px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
    }

    .footer {
      position: absolute;
      right: 20px;
      bottom: 20px;
      left: 20px;
      color: rgba(208, 225, 255, 0.48);
      font-size: 8px;
      letter-spacing: 0.2em;
      text-align: center;
      text-transform: uppercase;
    }

    @keyframes sweep {
      0%,
      15% {
        transform: translateX(0) rotate(24deg);
        opacity: 0;
      }

      35% {
        opacity: 1;
      }

      85%,
      100% {
        transform: translateX(460%) rotate(24deg);
        opacity: 0;
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(24px);
        filter: blur(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-10px) scale(1.04);
      }
    }

    @media (max-height: 650px) {
      .content {
        padding-top: 55px;
      }

      .orb {
        width: 125px;
        height: 125px;
        margin: 22px auto;
      }

      .description {
        margin-top: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main class="phone">
    <div class="screen">
      <div class="notch"></div>

      <div class="content">
        <div class="eyebrow">Next generation performance</div>

        <h1>
          <span>Beyond</span>
          limits.
        </h1>

        <p class="description">
          Precision engineered power inside an impossibly refined design.
        </p>

        <div class="orb"></div>

        <div class="button">
          Experience the future
        </div>
      </div>

      <div class="footer">Ultra performance / 2026</div>
    </div>
  </main>
  <style>
/*
 * During export, pause browser animations and manually position
 * them using --render-time.
 */
html[data-rendering="true"] *,
html[data-rendering="true"] *::before,
html[data-rendering="true"] *::after {
  animation-play-state: paused !important;
  animation-delay: calc(var(--render-time, 0s) * -1) !important;
  transition: none !important;
}
</style>

<script>
window.RENDER_DURATION = 15;

window.seekToFrame = async function (frame, time, fps) {
  document.documentElement.style.setProperty(
    "--render-time",
    `${time}s`
  );

  // Reset any JavaScript animation state here if you have one.
  //
  // Example:
  // const progress = time / window.RENDER_DURATION;
  // document.querySelector(".progress").style.width =
  //   `${progress * 100}%`;

  await new Promise(resolve => requestAnimationFrame(resolve));
};
</script>

  
</body>
</html>
