<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON PIXEL | Zai Experience</title>
    
    <!-- Import Premium Apple-style Font: SF Pro Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #000000;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent-color: #cd7f32; /* Classic Gold */
            --meta-color: #52525b;
            --screen-width: 100vw;
            --screen-height: 177.77vw; /* 16:9 aspect ratio -> 9:16 on display */
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #111;
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Container simulates the device aspect ratio */
        .app-container {
            width: 100%;
            height: 100vh;
            background: var(--bg-color);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Pixel Art MASCOT */
        .character-container {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            z-index: 2;
            pointer-events: none; /* Let clicks pass through */
        }

        .pixel-char {
            width: 100%;
            height: 100%;
            background: var(--accent-color);
            box-shadow: 0 0 30px var(--accent-color);
            /* Using a mosaic effect to simulate pixels via clip-path on children */
            position: relative;
        }

        .pixel-eye {
            position: absolute;
            width: 30%;
            height: 30%;
            background: #000;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 4px;
            box-shadow: inset -5px -5px 0 #6b4a22;
        }

        .pixel-mouth {
            position: absolute;
            width: 40%;
            height: 12px;
            bottom: 20%;
            left: 30%;
            background: #2a0a00;
            border-radius: 12px;
        }

        /* Subtle "float" animation using CSS variables */
        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
            50% { transform: translate(-50%, -50%) translateY(-15px); }
        }

        .pixel-char {
            animation: float 4s ease-in-out infinite;
        }

        /* UI Overlay Elements */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 24px 20px 0;
            font-size: 12px;
            font-weight: 600;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 5;
        }

        /* Text Animations */
        .anim-text-wrap {
            overflow: hidden;
            display: inline-block;
        }

        .headline {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff 0%, #999 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0; /* Hidden initially */
            transform: translateY(50px);
        }

        .sub-headline {
            font-size: 1.25rem;
            font-weight: 400;
            color: var(--text-secondary);
            max-width: 300px;
            line-height: 1.5;
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(30px);
        }

        .tech-specs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            opacity: 0;
            transform: scale(0.95);
        }

        .spec-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 24px;
            text-align: left;
            transition: transform 0.3s ease;
        }
        
        .spec-card:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.1);
        }

        .spec-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .spec-value {
            font-size: 1.5rem;
            font-weight: 500;
            color: #fff;
        }

        /* Light Sweep Animation */
        .light-sweeper {
            position: absolute;
            top: 0;
            left: -100%; /* Start off screen left */
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(205, 127, 50, 0.3), transparent);
            transform: skewX(-20deg);
            pointer-events: none;
            z-index: 4;
            mix-blend-mode: overlay;
        }

        /* Floating Particles */
        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        /* Animations Keyframes */
        @keyframes sweep {
            0% { left: -50%; }
            100% { left: 150%; }
        }

        @keyframes textFadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Interactive Element for Character Cursor */
        .cursor-light {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: width 0.2s, height 0.2s;
            z-index: 3;
        }

        /* Responsive scaling for larger screens */
        @media (min-height: 900px) {
            .app-container {
                width: 600px;
                height: auto;
                min-height: 100vh;
                aspect-ratio: 9/16;
                border-radius: 40px;
                overflow: hidden;
                box-shadow: 0 0 50px rgba(0,0,0,0.5);
            }
            body { background: #000; }
            .headline { font-size: 5rem; }
            .pixel-char { width: 250px; height: 250px; }
        }

    </style>
</head>
<body>

    <div class="app-container" id="app">
        
        <!-- Cursor Follower Light -->
        <div class="cursor-light" id="cursor"></div>

        <!-- Top Status Bar -->
        <div class="status-bar">
            <span id="clock">9:41</span>
            <span>5G</span>
        </div>

        <!-- Scanning Light (Background Effect) -->
        <div class="light-sweeper" id="sweep"></div>

        <!-- The Pixel Character -->
        <div class="character-container" id="character">
            <div class="pixel-char">
                <div class="pixel-eye"></div>
                <div class="pixel-mouth"></div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            
            <div class="anim-content-wrap">
                <h1 class="headline" id="headline">NEON<br>REALITY</h1>
            </div>
            
            <p class="sub-headline" id="subhead">Experience the next generation of pixel-perfect immersion.</p>

            <div class="tech-specs" id="specs">
                <div class="spec-card">
                    <div class="spec-title">Resolution</div>
                    <div class="spec-value">8K/60</div>
                </div>
                <div class="spec-card">
                    <div class="spec-title">Colors</div>
                    <div class="spec-value">1B+</div>
                </div>
                <div class="spec-card">
                    <div class="spec-title">Power</div>
                    <div class="spec-value">Tensor X</div>
                </div>
                <div class="spec-card">
                    <div class="spec-title">Battery</div>
                    <div class="spec-value">48h LiPo</div>
                </div>
            </div>

        </div>
        
    </div>

    <script>
        // DOM Elements
        const sweep = document.getElementById('sweep');
        const cursor = document.getElementById('cursor');
        const character = document.getElementById('character');
        const specs = document.getElementById('specs');
        const headline = document.getElementById('headline');
        const subhead = document.getElementById('subhead');
        const clockEl = document.getElementById('clock');

        // 1. Initialize Clock (Apple style sticky top)
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            clockEl.textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Light Sweep Animation
        // Starts off-screen and sweeps across
        function startSweep() {
            sweep.style.animation = 'sweep 4s linear forwards';
            
            // After sweep passes, fade in elements
            setTimeout(() => {
                headline.style.animation = 'textFadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards';
            }, 800);

            setTimeout(() => {
                subhead.style.animation = 'textFadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.3s';
                specs.style.animation = 'slideInLeft 0.6s ease-out forwards 0.6s';
            }, 2000);
        }

        // Start animations on load
        window.onload = () => {
            startSweep();
            createParticles();
        };

        // 3. Interactive Cursor Light (Glass effect)
        document.addEventListener('mousemove', (e) => {
            // Move cursor light
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';

            // Move character slightly towards mouse (classic Apple ad logic)
            const centerX = window.innerWidth / 2;
            const moveX = (e.clientX - centerX) / 40;
            
            // Apply subtle translation to character container
            character.style.transform = `translate(calc(-50% + ${moveX}px), -50%)`;
        });

        // 4. Create Floating Particles for "Fantasy Pixel" feel
        function createParticles() {
            const container = document.getElementById('app');
            const particleCount = 20;

            for(let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                
                // Randomize appearance
                const size = Math.random() * 4 + 1; // 1px to 5px
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.left = `${Math.random() * 100}vw`;
                p.style.top = `${Math.random() * 100}vh`;
                p.style.background = Math.random() > 0.5 ? '#cd7f32' : 'rgba(255,255,255,0.3)';
                
                container.appendChild(p);

                // Animate
                const duration = Math.random() * 10 + 5;
                const delay = Math.random() * 5;
                
                p.animate([
                    { transform: 'translate(0, 0) scale(0)', opacity: 0 },
                    { transform: `translate(${Math.random()*100 - 50}px, ${Math.random()*-200 - 50}px) scale(1)`, opacity: 0.8, offset: 0.5 },
                    { transform: `translate(${Math.random()*100 - 50}px, ${-Math.random()*200}px) scale(0)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    delay: delay * 1000,
                    iterations: Infinity
                });
            }
        }
    </script>
</body>
</html>
