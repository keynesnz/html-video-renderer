<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Community Shield — Arsenal vs Manchester City</title>
<style>
  :root{
    --arsenal-red:#DB0007;
    --arsenal-red-dk:#8f0005;
    --city-blue:#6CABDD;
    --city-navy:#0F1B3C;
    --ink:#050608;
    --paper:#F2EFE6;
    --gold:#C9A24B;
  }

  @font-face{
    font-family:'DispCond';
    src:local('Arial Narrow Bold');
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    width:1080px;
    height:1920px;
    background:var(--ink);
    overflow:hidden;
    font-family:'Oswald','Arial Narrow',Arial,sans-serif;
  }

  #stage{
    position:relative;
    width:1080px;
    height:1920px;
    background:
      radial-gradient(circle at 50% 18%, rgba(255,255,255,0.06), transparent 55%),
      linear-gradient(180deg, #05070c 0%, #0a0d16 45%, #05070c 100%);
    overflow:hidden;
  }

  /* ---------- shared texture layers ---------- */
  .grain{
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
    pointer-events:none;
    z-index:50;
  }

  .vignette{
    position:absolute; inset:0;
    box-shadow: inset 0 0 260px 120px rgba(0,0,0,0.75);
    pointer-events:none;
    z-index:49;
  }

  .floodbeam{
    position:absolute;
    top:-200px; left:50%;
    width:2600px; height:1400px;
    background:conic-gradient(from 90deg at 50% 0%,
      rgba(255,255,255,0) 0deg,
      rgba(255,255,255,0.05) 8deg,
      rgba(255,255,255,0) 16deg);
    transform:translateX(-50%);
    animation: sweep 15s linear infinite;
    z-index:1;
  }
  @keyframes sweep{
    0%{ transform:translateX(-50%) rotate(-8deg); }
    50%{ transform:translateX(-50%) rotate(8deg); }
    100%{ transform:translateX(-50%) rotate(-8deg); }
  }

  .pitchlines{
    position:absolute;
    bottom:-40px; left:50%;
    width:1800px; height:900px;
    transform:translateX(-50%) perspective(600px) rotateX(55deg);
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 90px);
    opacity:0.5;
    z-index:1;
  }

  /* ===================================================================
     SCENE FRAMEWORK — sequential opacity/transform driven by one master
     timeline (15s / 450 frames @30fps). Each scene owns a time slice.
  =================================================================== */
  .scene{
    position:absolute; inset:0;
    opacity:0;
    z-index:10;
  }

  /* ---------------- SCENE 1 : 0.0s – 3.4s — Ignition ---------------- */
  #s1{ animation: s1-op 15s linear forwards; }
  @keyframes s1-op{
    0%{opacity:0} 3%{opacity:1} 20%{opacity:1} 24%{opacity:0} 100%{opacity:0}
  }
  .ignite-word{
    position:absolute; top:44%; left:50%;
    transform:translate(-50%,-50%) scale(0.7);
    font-family:'Anton','Oswald',sans-serif;
    font-weight:900;
    font-size:52px;
    letter-spacing:12px;
    color:var(--paper);
    text-transform:uppercase;
    text-align:center;
    white-space:nowrap;
    opacity:0;
    animation: ignite-in 3.4s cubic-bezier(.2,.9,.15,1) forwards;
  }
  @keyframes ignite-in{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(0.7); letter-spacing:2px;}
    30%{ opacity:1; transform:translate(-50%,-50%) scale(1); letter-spacing:12px;}
    75%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-58%) scale(1.05);}
  }
  .ignite-sub{
    position:absolute; top:52%; left:50%;
    transform:translate(-50%,0);
    font-size:22px; letter-spacing:10px; color:var(--gold);
    text-transform:uppercase; opacity:0;
    animation: sub-in 3.4s ease forwards;
  }
  @keyframes sub-in{
    0%{opacity:0} 40%{opacity:0} 55%{opacity:1} 90%{opacity:1} 100%{opacity:0}
  }
  .ring{
    position:absolute; top:44%; left:50%; width:60px; height:60px;
    border:2px solid var(--gold); border-radius:50%;
    transform:translate(-50%,-50%) scale(0.2); opacity:0;
    animation: ring-out 3.4s ease-out forwards;
  }
  @keyframes ring-out{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(0.2);}
    10%{ opacity:.9; }
    60%{ opacity:0; transform:translate(-50%,-50%) scale(14);}
    100%{opacity:0;}
  }

  /* ---------------- SCENE 2 : 3.0s – 8.2s — Crest clash --------------- */
  #s2{ animation: s2-op 15s linear forwards; }
  @keyframes s2-op{
    0%{opacity:0} 20%{opacity:0} 22%{opacity:1} 53%{opacity:1} 57%{opacity:0} 100%{opacity:0}
  }

  .halfsplit{
    position:absolute; inset:0;
    display:flex;
  }
  .half{
    position:relative;
    width:50%; height:100%;
    overflow:hidden;
  }
  .half.left{
    background:linear-gradient(135deg, var(--arsenal-red-dk) 0%, var(--arsenal-red) 55%, #4a0003 100%);
    clip-path:polygon(0 0, 100% 0, 92% 100%, 0% 100%);
    transform:translateX(-110%);
    animation: slide-l 5.2s cubic-bezier(.16,.9,.2,1) forwards;
    animation-delay:0s;
  }
  .half.right{
    background:linear-gradient(225deg, var(--city-navy) 0%, var(--city-blue) 55%, #071026 100%);
    clip-path:polygon(8% 0, 100% 0, 100% 100%, 0% 100%);
    transform:translateX(110%);
    animation: slide-r 5.2s cubic-bezier(.16,.9,.2,1) forwards;
  }
  #s2.scene .half{ animation-play-state:paused; }
  @keyframes slide-l{ 0%{transform:translateX(-110%);} 100%{transform:translateX(0);} }
  @keyframes slide-r{ 0%{transform:translateX(110%);} 100%{transform:translateX(0);} }

  /* Re-trigger halves relative to scene start using a wrapper delay via nested animation on parent */
  .split-wrap{
    position:absolute; inset:0;
    animation: split-hold 15s linear forwards;
  }

  .crest{
    position:absolute; top:38%;
    width:230px; height:230px;
    opacity:0;
  }
  .crest.arsenal{ left:14%; animation: crest-l 15s ease forwards; }
  .crest.city{ right:14%; animation: crest-r 15s ease forwards; }
  @keyframes crest-l{
    0%{opacity:0; transform:translate(-40px,-50%) rotate(-12deg) scale(.6);}
    24%{opacity:0; transform:translate(-40px,-50%) rotate(-12deg) scale(.6);}
    30%{opacity:1; transform:translate(0,-50%) rotate(0) scale(1);}
    53%{opacity:1;}
    57%{opacity:0;}
    100%{opacity:0;}
  }
  @keyframes crest-r{
    0%{opacity:0; transform:translate(40px,-50%) rotate(12deg) scale(.6);}
    24%{opacity:0; transform:translate(40px,-50%) rotate(12deg) scale(.6);}
    30%{opacity:1; transform:translate(0,-50%) rotate(0) scale(1);}
    53%{opacity:1;}
    57%{opacity:0;}
    100%{opacity:0;}
  }

  .crest-badge{
    width:100%; height:100%;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.25), rgba(255,255,255,0) 60%), rgba(0,0,0,0.25);
    border:5px solid var(--paper);
    box-shadow:0 20px 50px rgba(0,0,0,0.5), inset 0 0 30px rgba(0,0,0,0.3);
  }
  .crest-badge svg{ width:70%; height:70%; }
  .crest-badge img{ width:78%; height:78%; object-fit:contain; }

  .team-tag{
    position:absolute; top:63%;
    font-family:'Anton','Oswald',sans-serif;
    font-size:46px; letter-spacing:2px; color:var(--paper);
    text-transform:uppercase; opacity:0; text-align:center;
  }
  .team-tag.arsenal{ left:14%; width:230px; animation:tag-l 15s ease forwards; }
  .team-tag.city{ right:14%; width:230px; animation:tag-r 15s ease forwards; }
  @keyframes tag-l{
    0%{opacity:0; transform:translateY(14px);} 28%{opacity:0;} 34%{opacity:1; transform:translateY(0);} 53%{opacity:1;} 57%{opacity:0;} 100%{opacity:0;}
  }
  @keyframes tag-r{
    0%{opacity:0; transform:translateY(14px);} 28%{opacity:0;} 34%{opacity:1; transform:translateY(0);} 53%{opacity:1;} 57%{opacity:0;} 100%{opacity:0;}
  }

  .vs-mark{
    position:absolute; top:38%; left:50%;
    transform:translate(-50%,-50%) scale(0);
    font-family:'Anton',sans-serif;
    font-size:130px; color:var(--gold);
    text-shadow:0 0 40px rgba(201,162,75,0.7), 0 10px 0 rgba(0,0,0,0.4);
    opacity:0;
    animation: vs-pop 15s ease forwards;
    z-index:5;
  }
  @keyframes vs-pop{
    0%{opacity:0; transform:translate(-50%,-50%) scale(0) rotate(-20deg);}
    36%{opacity:0; transform:translate(-50%,-50%) scale(0) rotate(-20deg);}
    41%{opacity:1; transform:translate(-50%,-50%) scale(1.25) rotate(4deg);}
    45%{transform:translate(-50%,-50%) scale(1) rotate(0deg);}
    53%{opacity:1;}
    57%{opacity:0;}
    100%{opacity:0;}
  }

  .comp-label{
    position:absolute; top:16%; left:50%; transform:translate(-50%,0);
    font-size:24px; letter-spacing:12px; color:rgba(242,239,230,0.75);
    text-transform:uppercase; opacity:0;
    animation: comp-in 15s ease forwards;
  }
  @keyframes comp-in{
    0%{opacity:0} 24%{opacity:0} 30%{opacity:1} 53%{opacity:1} 57%{opacity:0} 100%{opacity:0}
  }

  /* ---------------- SCENE 3 : 8.0s – 12.4s — Matchday info card ------- */
  #s3{ animation: s3-op 15s linear forwards; }
  @keyframes s3-op{
    0%{opacity:0} 53%{opacity:0} 56%{opacity:1} 82%{opacity:1} 86%{opacity:0} 100%{opacity:0}
  }
  .card{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0.9);
    width:920px;
    padding:70px 60px;
    background:linear-gradient(180deg, rgba(15,20,30,0.92), rgba(6,8,12,0.96));
    border:2px solid rgba(201,162,75,0.4);
    text-align:center;
    opacity:0;
    animation: card-in 15s ease forwards;
  }
  @keyframes card-in{
    0%{opacity:0; transform:translate(-50%,-50%) scale(0.9);}
    56%{opacity:0; transform:translate(-50%,-50%) scale(0.9);}
    62%{opacity:1; transform:translate(-50%,-50%) scale(1);}
    82%{opacity:1;}
    86%{opacity:0;}
    100%{opacity:0;}
  }
  .card-eyebrow{
    font-size:20px; letter-spacing:10px; color:var(--gold); text-transform:uppercase; margin-bottom:34px;
  }
  .card-teams{
    display:flex; align-items:center; justify-content:center; gap:40px;
    font-family:'Anton',sans-serif; font-size:58px; color:var(--paper); text-transform:uppercase;
    line-height:1.15; margin-bottom:36px;
  }
  .card-teams .vs-small{ font-size:30px; color:var(--gold); }
  .card-side{ display:flex; flex-direction:column; align-items:center; gap:14px; width:280px; }
  .mini-badge{
    width:90px; height:90px; border-radius:50%;
    border:3px solid var(--paper);
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.06);
  }
  .mini-badge svg{ width:64%; height:64%; }
  .mini-badge img{ width:72%; height:72%; object-fit:contain; }
  .card-side.ars .mini-badge{ background:radial-gradient(circle at 35% 30%, rgba(219,0,7,0.5), rgba(0,0,0,0.3)); }
  .card-side.city .mini-badge{ background:radial-gradient(circle at 35% 30%, rgba(108,171,221,0.5), rgba(0,0,0,0.3)); }

  .divider{
    width:120px; height:2px; margin:0 auto 34px; background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .card-meta{
    display:flex; justify-content:center; gap:60px;
    font-size:24px; letter-spacing:3px; color:rgba(242,239,230,0.85); text-transform:uppercase;
  }
  .card-meta div span{ display:block; font-size:15px; letter-spacing:4px; color:var(--gold); margin-bottom:8px; }

  /* ---------------- SCENE 4 : 12.2s – 15s — Kickoff call to action ---- */
  #s4{ animation: s4-op 15s linear forwards; }
  @keyframes s4-op{
    0%{opacity:0} 82%{opacity:0} 85%{opacity:1} 100%{opacity:1}
  }
  .ko-wrap{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .ko-strip{
    width:100%; padding:26px 0; margin-bottom:46px;
    background:linear-gradient(90deg, var(--arsenal-red) 0%, var(--arsenal-red) 49%, var(--city-blue) 51%, var(--city-blue) 100%);
    display:flex; justify-content:center;
    transform:scaleX(0);
    animation: strip-in 2.8s cubic-bezier(.2,.9,.2,1) forwards;
    animation-delay:0.15s;
  }
  @keyframes strip-in{ to{ transform:scaleX(1);} }
  .ko-strip span{
    font-family:'Anton',sans-serif; font-size:34px; letter-spacing:8px; color:var(--paper);
    text-shadow:0 3px 10px rgba(0,0,0,0.5);
  }
  .ko-clock{
    font-family:'Anton',sans-serif; font-size:150px; color:var(--paper); letter-spacing:4px;
    opacity:0; transform:translateY(30px);
    animation: clock-in 2.6s ease forwards;
    animation-delay:0.6s;
    text-shadow:0 0 60px rgba(201,162,75,0.5);
  }
  @keyframes clock-in{ to{ opacity:1; transform:translateY(0);} }
  .ko-caption{
    margin-top:30px; font-size:24px; letter-spacing:9px; color:var(--gold); text-transform:uppercase;
    opacity:0; animation: cap-in 2s ease forwards; animation-delay:1.3s;
  }
  @keyframes cap-in{ to{opacity:1;} }
  .pulse-dot{
    width:14px; height:14px; border-radius:50%; background:#ff4b4b; display:inline-block; margin-right:10px;
    animation: pulse 1s ease-in-out infinite;
    box-shadow:0 0 12px rgba(255,75,75,0.8);
  }
  @keyframes pulse{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(0.7);} }

  .venue{
    position:absolute; bottom:120px; left:50%; transform:translateX(-50%);
    font-size:20px; letter-spacing:6px; color:rgba(242,239,230,0.6); text-transform:uppercase;
    opacity:0; animation:cap-in 2s ease forwards; animation-delay:1.6s;
  }

  /* corner frame ticks — persistent broadcast feel */
  .frame-tick{
    position:absolute; width:46px; height:46px; border-color:var(--gold); border-style:solid; opacity:0.55; z-index:60;
  }
  .frame-tick.tl{ top:36px; left:36px; border-width:3px 0 0 3px; }
  .frame-tick.tr{ top:36px; right:36px; border-width:3px 3px 0 0; }
  .frame-tick.bl{ bottom:36px; left:36px; border-width:0 0 3px 3px; }
  .frame-tick.br{ bottom:36px; right:36px; border-width:0 3px 3px 0; }
</style>
</head>
<body>
<div id="stage">

  <div class="floodbeam"></div>
  <div class="pitchlines"></div>

  <!-- SCENE 1 : Ignition -->
  <div class="scene" id="s1">
    <div class="ring"></div>
    <div class="ignite-word">COMMUNITY SHIELD</div>
    <div class="ignite-sub">North London Meets Manchester</div>
  </div>

  <!-- SCENE 2 : Crest Clash -->
  <div class="scene" id="s2">
    <div class="split-wrap">
      <div class="halfsplit">
        <div class="half left"></div>
        <div class="half right"></div>
      </div>
    </div>
    <div class="comp-label">Community Shield</div>

    <div class="crest arsenal">
      <div class="crest-badge">
        <img src="assets/arsenal.png" alt="Arsenal crest"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <svg style="display:none" viewBox="0 0 100 100"><path d="M50 8 L82 20 V50 C82 72 68 88 50 96 C32 88 18 72 18 50 V20 Z" fill="#DB0007" stroke="#F2EFE6" stroke-width="3"/><rect x="46" y="24" width="8" height="40" fill="#F2EFE6"/><rect x="30" y="40" width="40" height="8" fill="#F2EFE6"/></svg>
      </div>
    </div>
    <div class="team-tag arsenal">Arsenal</div>

    <div class="vs-mark">VS</div>

    <div class="crest city">
      <div class="crest-badge">
        <img src="assets/mancity.png" alt="Manchester City crest"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <svg style="display:none" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#6CABDD" stroke="#F2EFE6" stroke-width="3"/><path d="M50 20 L58 42 H42 Z" fill="#0F1B3C"/><circle cx="50" cy="60" r="12" fill="#0F1B3C"/></svg>
      </div>
    </div>
    <div class="team-tag city">Man City</div>
  </div>

  <!-- SCENE 3 : Info Card -->
  <div class="scene" id="s3">
    <div class="card">
      <div class="card-eyebrow">Wembley Stadium</div>
      <div class="card-teams">
        <div class="card-side ars">
          <div class="mini-badge">
            <img src="assets/arsenal.png" alt="Arsenal crest"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <svg style="display:none" viewBox="0 0 100 100"><path d="M50 8 L82 20 V50 C82 72 68 88 50 96 C32 88 18 72 18 50 V20 Z" fill="#DB0007" stroke="#F2EFE6" stroke-width="3"/></svg>
          </div>
          ARS
        </div>
        <div class="vs-small">VS</div>
        <div class="card-side city">
          <div class="mini-badge">
            <img src="assets/mancity.png" alt="Manchester City crest"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <svg style="display:none" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#6CABDD" stroke="#F2EFE6" stroke-width="3"/></svg>
          </div>
          MCI
        </div>
      </div>
      <div class="divider"></div>
      <div class="card-meta">
        <div><span>Kickoff</span>16:30 BST</div>
        <div><span>Competition</span>Community Shield</div>
      </div>
    </div>
  </div>

  <!-- SCENE 4 : Kickoff CTA -->
  <div class="scene" id="s4">
    <div class="ko-wrap">
      <div class="ko-strip"><span>COMMUNITY SHIELD</span></div>
      <div class="ko-clock">16:30</div>
      <div class="ko-caption"><span class="pulse-dot"></span>KICK OFF SOON</div>
    </div>
    <div class="venue">Wembley Stadium · London</div>
  </div>

  <div class="frame-tick tl"></div>
  <div class="frame-tick tr"></div>
  <div class="frame-tick bl"></div>
  <div class="frame-tick br"></div>

  <div class="vignette"></div>
  <div class="grain"></div>
</div>
</body>
</html>
