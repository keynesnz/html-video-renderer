<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxury Background</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #09070d;
    }

    .background {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background:
        linear-gradient(
          135deg,
          #09070d 0%,
          #160c29 42%,
          #321050 72%,
          #5c1b55 100%
        );
    }

    .background::before {
      content: "";
      position: absolute;
      width: 65vw;
      height: 65vw;
      top: -30vw;
      left: -15vw;
      border-radius: 50%;
      background: #8c2cff;
      filter: blur(120px);
      opacity: 0.42;
      animation: purpleLight 15s ease-in-out infinite alternate;
    }

    .background::after {
      content: "";
      position: absolute;
      width: 60vw;
      height: 60vw;
      right: -22vw;
      bottom: -28vw;
      border-radius: 50%;
      background: #ff9d00;
      filter: blur(120px);
      opacity: 0.36;
      animation: goldLight 18s ease-in-out infinite alternate;
    }

    .diamond {
      position: absolute;
      width: 52vw;
      height: 52vw;
      top: 50%;
      left: 50%;
      border: 1px solid rgba(255, 202, 92, 0.32);
      transform: translate(-50%, -50%) rotate(45deg);
      box-shadow:
        0 0 40px rgba(255, 170, 0, 0.16),
        inset 0 0 40px rgba(255, 170, 0, 0.1);
      animation: rotateDiamond 25s linear infinite;
    }

    .diamond::before,
    .diamond::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.13);
      transform: rotate(45deg);
    }

    .diamond::before {
      inset: 12%;
    }

    .diamond::after {
      inset: 25%;
      border-color: rgba(255, 202, 92, 0.22);
    }

    .line {
      position: absolute;
      width: 160%;
      height: 1px;
      left: -30%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 196, 75, 0.55),
        transparent
      );
      transform: rotate(-28deg);
      filter: blur(1px);
    }

    .line.one {
      top: 27%;
      animation: lineMove 9s ease-in-out infinite alternate;
    }

    .line.two {
      top: 66%;
      transform: rotate(28deg);
      opacity: 0.55;
      animation: lineMoveTwo 12s ease-in-out infinite alternate;
    }

    .glow {
      position: absolute;
      width: 22vw;
      height: 22vw;
      top: 32%;
      left: 42%;
      border-radius: 50%;
      background: #ffb52e;
      filter: blur(85px);
      opacity: 0.18;
      animation: centerGlow 8s ease-in-out infinite alternate;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          115deg,
          rgba(255, 255, 255, 0.05),
          transparent 35%,
          rgba(0, 0, 0, 0.25)
        );
      backdrop-filter: blur(2px);
    }

    @keyframes purpleLight {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(25vw, 18vh) scale(1.25);
      }
    }

    @keyframes goldLight {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(-22vw, -20vh) scale(1.3);
      }
    }

    @keyframes rotateDiamond {
      from {
        transform: translate(-50%, -50%) rotate(45deg);
      }

      to {
        transform: translate(-50%, -50%) rotate(405deg);
      }
    }

    @keyframes lineMove {
      from {
        transform: translateX(-10%) rotate(-28deg);
      }

      to {
        transform: translateX(10%) rotate(-22deg);
      }
    }

    @keyframes lineMoveTwo {
      from {
        transform: translateX(8%) rotate(28deg);
      }

      to {
        transform: translateX(-8%) rotate(22deg);
      }
    }

    @keyframes centerGlow {
      from {
        transform: scale(0.8);
        opacity: 0.12;
      }

      to {
        transform: scale(1.35);
        opacity: 0.3;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="background">
    <div class="diamond"></div>
    <div class="line one"></div>
    <div class="line two"></div>
    <div class="glow"></div>
    <div class="overlay"></div>
  </main>
</body>
</html>
