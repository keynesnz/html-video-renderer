<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Premium Lyrics</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 50% 50%,
          #0b3d28 0%,
          #061d13 35%,
          #020806 75%,
          #000 100%
        );

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    /* Ambient green glow */
    body::before {
      content: "";
      position: fixed;

      width: 60vw;
      height: 60vw;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      background: #00ff8830;
      filter: blur(150px);
      border-radius: 50%;

      animation: ambient 7s ease-in-out infinite alternate;
    }

    .lyrics {
      position: relative;
      z-index: 2;

      width: 90%;
      max-width: 1100px;
      min-height: 150px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      color: #f5fff9;

      font-size: clamp(30px, 5vw, 70px);
      font-weight: 300;

      letter-spacing: -2px;
      line-height: 1.2;

      text-shadow:
        0 0 20px #00ff8830,
        0 0 50px #00ff8815;
    }

    .line {
      position: absolute;

      width: 100%;

      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .line.active {
      opacity: 1;
    }

    .word {
      display: inline-block;

      opacity: 0;
      filter: blur(8px);

      transform:
        translateY(18px)
        scale(.97);

      margin-right: 0.22em;

      transition:
        opacity 0.55s cubic-bezier(.22, .61, .36, 1),
        transform 0.55s cubic-bezier(.22, .61, .36, 1),
        filter 0.55s ease;
    }

    .word.visible {
      opacity: 1;

      transform:
        translateY(0)
        scale(1);

      filter: blur(0);
    }

    /* Ambient light */
    @keyframes ambient {
      from {
        opacity: .4;
        transform:
          translate(-50%, -50%)
          scale(.9);
      }

      to {
        opacity: .8;
        transform:
          translate(-50%, -50%)
          scale(1.1);
      }
    }

    @media (max-width: 600px) {
      .lyrics {
        font-size: 30px;
        letter-spacing: -1px;
      }
    }
  </style>
</head>

<body>

  <div class="lyrics">

    <div class="line">
      <span class="word">So</span>
      <span class="word">baby,</span>
      <span class="word">don't</span>
      <span class="word">worry,</span>
    </div>

    <div class="line">
      <span class="word">you</span>
      <span class="word">are</span>
      <span class="word">my</span>
      <span class="word">only</span>
    </div>

    <div class="line">
      <span class="word">You</span>
      <span class="word">won't</span>
      <span class="word">be</span>
      <span class="word">lonely</span>
    </div>

    <div class="line">
      <span class="word">even</span>
      <span class="word">if</span>
      <span class="word">the</span>
      <span class="word">sky</span>
      <span class="word">is</span>
      <span class="word">falling</span>
      <span class="word">down</span>
    </div>

  </div>


  <script>
    const lines = document.querySelectorAll(".line");

    // Kecepatan munculnya setiap kata
    const WORD_DELAY = 175;

    // Waktu setelah satu baris lengkap sebelum menghilang
    const HOLD_TIME = 900;

    // Durasi fade out
    const FADE_OUT = 600;

    // Jeda sebelum baris berikutnya
    const GAP = 300;


    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }


    async function showLine(line) {

      const words = line.querySelectorAll(".word");

      // Reset semua kata terlebih dahulu
      words.forEach(word => {
        word.classList.remove("visible");
      });

      // Tampilkan baris
      line.classList.add("active");

      // Munculkan kata satu per satu
      for (const word of words) {
        await wait(WORD_DELAY);

        word.classList.add("visible");
      }

      // Biarkan satu baris lengkap terlihat
      await wait(HOLD_TIME);

      // Hilangkan seluruh baris
      line.classList.remove("active");

      // Reset kata setelah fade out
      await wait(FADE_OUT);

      words.forEach(word => {
        word.classList.remove("visible");
      });

      // Jeda kecil sebelum baris berikutnya
      await wait(GAP);
    }


    async function playLyrics() {

      while (true) {

        // Selalu mulai dari baris pertama
        for (const line of lines) {
          await showLine(line);
        }

      }

    }


    // Mulai animasi
    playLyrics();
  </script>

</body>
</html>
