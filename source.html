<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Product Banner</title>

  <style>
    :root {
      --bg: #05070b;
      --white: #f7f9ff;
      --muted: #8b93a7;
      --blue: #66b8ff;
      --violet: #9a7cff;
      --cyan: #46f0ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #020307;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--white);
    }

    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;

      /* 2K, 19:6 ratio */
      width: min(2048px, 100vw);
      aspect-ratio: 19 / 6;

      min-height: 260px;
      background:
        radial-gradient(
          ellipse at 76% 45%,
          rgba(72, 137, 255, 0.2),
          transparent 30%
        ),
        radial-gradient(
          ellipse at 38% 90%,
          rgba(130, 69, 255, 0.13),
          transparent 34%
        ),
        linear-gradient(115deg, #030408 0%, #090c14 50%, #030408 100%);

      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 25px 100px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* Fine premium grid */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      opacity: 0.35;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(90deg, black, transparent 82%);
    }

    /* Animated diagonal light sweep */
    .hero::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: -80%;
      left: -30%;
      width: 22%;
      height: 260%;
      transform: rotate(25deg);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.03) 28%,
        rgba(116, 207, 255, 0.46) 50%,
        rgba(255, 255, 255, 0.03) 72%,
        transparent
      );
      filter: blur(12px);
      animation: lightSweep 5.8s ease-in-out infinite;
      pointer-events: none;
    }

    .noise {
      position: absolute;
      inset: 0;
      z-index: 5;
      opacity: 0.035;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      padding: clamp(28px, 6vw, 100px);
    }

    .copy {
      max-width: 650px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--blue);
      font-size: clamp(10px, 0.75vw, 16px);
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      animation: fadeUp 0.9s 0.1s both;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan));
      box-shadow: 0 0 12px var(--cyan);
    }

    h1 {
      margin: 0;
      max-width: 800px;
      font-size: clamp(42px, 6.6vw, 132px);
      line-height: 0.86;
      letter-spacing: -0.075em;
      font-weight: 800;
      animation: fadeUp 0.9s 0.25s both;
    }

    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(
        110deg,
        #ffffff 5%,
        #a9d8ff 38%,
        #ffffff 63%,
        #6578ff 100%
      );
      background-clip: text;
      -webkit-background-clip: text;
      filter: drop-shadow(0 0 26px rgba(100, 180, 255, 0.16));
    }

    .description {
      max-width: 430px;
      margin: 26px 0 0;
      color: var(--muted);
      font-size: clamp(12px, 1vw, 20px);
      line-height: 1.55;
      animation: fadeUp 0.9s 0.4s both;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      margin-top: 30px;
      padding: 13px 21px;
      color: #fff;
      border: 1px solid rgba(160, 218, 255, 0.55);
      background: rgba(255, 255, 255, 0.06);
      box-shadow:
        inset 0 0 20px rgba(75, 177, 255, 0.12),
        0 0 28px rgba(79, 163, 255, 0.12);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      animation: fadeUp 0.9s 0.55s both;
    }

    .cta i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 14px var(--cyan);
    }

    .product-orb {
      position: absolute;
      right: 11%;
      top: 50%;
      width: clamp(150px, 20vw, 390px);
      aspect-ratio: 1;
      transform: translateY(-50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #d5f5ff 0 1%, transparent 2%),
        radial-gradient(circle, rgba(73, 216, 255, 0.52), transparent 47%),
        radial-gradient(circle, rgba(101, 85, 255, 0.3), transparent 66%);
      filter: blur(0.2px);
      box-shadow:
        0 0 50px rgba(63, 193, 255, 0.25),
        0 0 150px rgba(83, 104, 255, 0.22);
      animation: orbFloat 5s ease-in-out infinite;
    }

    .product-orb::before,
    .product-orb::after {
      content: "";
      position: absolute;
      inset: 8%;
      border: 1px solid rgba(158, 224, 255, 0.45);
      border-radius: 50%;
      transform: rotate(35deg) scaleX(1.8);
      box-shadow: 0 0 18px rgba(91, 205, 255, 0.45);
    }

    .product-orb::after {
      transform: rotate(-35deg) scaleX(1.8);
      opacity: 0.6;
    }

    .spec {
      position: absolute;
      right: 5%;
      bottom: 10%;
      color: rgba(210, 229, 255, 0.62);
      font-size: clamp(9px, 0.7vw, 14px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      animation: fadeIn 1.2s 0.8s both;
    }

    @keyframes lightSweep {
      0%,
      20% {
        transform: translateX(-20vw) rotate(25deg);
        opacity: 0;
      }

      35% {
        opacity: 1;
      }

      75% {
        opacity: 0.85;
      }

      100% {
        transform: translateX(145vw) rotate(25deg);
        opacity: 0;
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px);
        filter: blur(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes orbFloat {
      0%,
      100% {
        transform: translateY(-50%) scale(1);
      }

      50% {
        transform: translateY(calc(-50% - 12px)) scale(1.045);
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 0;
      }

      .hero {
        min-height: 340px;
        aspect-ratio: auto;
      }

      .content {
        align-items: flex-start;
        padding: 42px 28px;
      }

      .product-orb {
        right: -12%;
        bottom: -14%;
        top: auto;
        transform: none;
        width: 230px;
        opacity: 0.7;
      }

      .spec {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main class="hero">
    <div class="noise"></div>

    <div class="content">
      <section class="copy">
        <div class="eyebrow">Next generation performance</div>

        <h1>
          <span>Beyond</span>
          limits.
        </h1>

        <p class="description">
          Precision engineered power inside an impossibly refined design.
        </p>

        <div class="cta">
          <i></i>
          Experience the future
        </div>
      </section>

      <div class="product-orb" aria-hidden="true"></div>
      <div class="spec">Ultra performance / 2026</div>
    </div>
  </main>
</body>
</html>
