<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Night Sky with Natural Clouds</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      min-height: 100vh;
      background: #030719;
      font-family: Arial, sans-serif;
    }

    .sky {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        linear-gradient(
          to bottom,
          #020516 0%,
          #071638 45%,
          #18295a 75%,
          #2d3e68 100%
        );
    }

    /* Stars */
    .stars,
    .stars::before,
    .stars::after {
      position: absolute;
      inset: 0;
      content: "";
      background-image:
        radial-gradient(circle, white 1px, transparent 2px),
        radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 2px),
        radial-gradient(circle, rgba(255,255,255,.5) 1px, transparent 2px);
      background-size: 90px 120px, 150px 170px, 220px 210px;
      background-position: 10px 20px, 50px 80px, 100px 30px;
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    .stars::before {
      opacity: 0.55;
      transform: scale(1.2);
      animation-delay: -2s;
    }

    .stars::after {
      opacity: 0.35;
      transform: scale(0.9);
      animation-delay: -1s;
    }

    /* Moon */
    .moon {
      position: absolute;
      top: 12%;
      left: -140px;
      z-index: 3;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background: #fffbd4;
      box-shadow:
        0 0 20px #fffbd4,
        0 0 50px rgba(255, 251, 212, 0.75),
        0 0 100px rgba(255, 251, 212, 0.3);
      animation: moonMove 26s linear infinite;
    }

    .moon::before {
      content: "";
      position: absolute;
      top: 21px;
      left: 25px;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: rgba(190, 185, 145, 0.35);
      box-shadow:
        34px 13px 0 5px rgba(190, 185, 145, 0.25),
        18px 49px 0 3px rgba(190, 185, 145, 0.3),
        57px 54px 0 7px rgba(190, 185, 145, 0.2),
        65px 29px 0 2px rgba(190, 185, 145, 0.3);
    }

    /*
      Natural cloud
      Each cloud has several soft overlapping cloud bubbles.
    */
    .cloud {
      position: absolute;
      left: -420px;
      z-index: 4;
      width: 390px;
      height: 125px;
      opacity: 0.72;
      filter: blur(0.4px) drop-shadow(0 14px 13px rgba(0, 0, 0, 0.3));
      animation: cloudMove linear infinite;
    }

    .cloud-body {
      position: absolute;
      left: 0;
      bottom: 4px;
      width: 100%;
      height: 63px;
      border-radius: 80px;
      background:
        linear-gradient(
          to bottom,
          rgba(225, 235, 255, 0.88),
          rgba(103, 126, 170, 0.72)
        );
      box-shadow:
        inset 0 8px 14px rgba(255, 255, 255, 0.35),
        inset 0 -13px 17px rgba(30, 48, 90, 0.22);
    }

    .puff {
      position: absolute;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 38% 28%,
          rgba(255, 255, 255, 0.98) 0%,
          rgba(224, 235, 255, 0.9) 48%,
          rgba(101, 126, 173, 0.72) 100%
        );
      box-shadow:
        inset -10px -12px 17px rgba(34, 53, 94, 0.18),
        inset 8px 7px 13px rgba(255, 255, 255, 0.32);
    }

    .puff-1 {
      left: 22px;
      bottom: 32px;
      width: 110px;
      height: 93px;
    }

    .puff-2 {
      left: 88px;
      bottom: 43px;
      width: 133px;
      height: 112px;
    }

    .puff-3 {
      left: 177px;
      bottom: 29px;
      width: 108px;
      height: 93px;
    }

    .puff-4 {
      left: 260px;
      bottom: 23px;
      width: 85px;
      height: 76px;
    }

    .cloud-1 {
      top: 24%;
      transform: scale(1.05);
      animation-duration: 39s;
    }

    .cloud-2 {
      top: 47%;
      transform: scale(0.72);
      opacity: 0.48;
      animation-duration: 27s;
      animation-delay: -11s;
    }

    .cloud-3 {
      top: 68%;
      transform: scale(1.35);
      opacity: 0.3;
      animation-duration: 52s;
      animation-delay: -25s;
    }

    /* Shooting star */
    .shooting-star {
      position: absolute;
      top: 18%;
      left: -160px;
      z-index: 2;
      width: 130px;
      height: 2px;
      background: linear-gradient(to right, transparent, white);
      transform: rotate(-25deg);
      animation: shootingStar 9s linear infinite;
    }

    .shooting-star::after {
      content: "";
      position: absolute;
      right: 0;
      top: -2px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 13px white;
    }

    /* Purple and white five-bar soundwave */
    .soundwave {
      position: absolute;
      left: 50%;
      bottom: 42px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 125px;
      height: 72px;
      padding: 12px 15px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 22px;
      background: rgba(10, 7, 35, 0.4);
      box-shadow:
        0 0 25px rgba(128, 55, 255, 0.35),
        inset 0 0 20px rgba(255, 255, 255, 0.05);
      transform: translateX(-50%);
      backdrop-filter: blur(8px);
    }

    .bar {
      width: 10px;
      height: 28px;
      border-radius: 10px;
      background: linear-gradient(
        to top,
        #8b35ff,
        #c98cff 55%,
        #ffffff
      );
      box-shadow:
        0 0 9px #a951ff,
        0 0 16px rgba(255, 255, 255, 0.7);
      animation: sound 1s ease-in-out infinite;
    }

    .bar:nth-child(1) {
      animation-delay: -0.45s;
    }

    .bar:nth-child(2) {
      animation-delay: -0.2s;
    }

    .bar:nth-child(3) {
      animation-delay: 0s;
    }

    .bar:nth-child(4) {
      animation-delay: -0.3s;
    }

    .bar:nth-child(5) {
      animation-delay: -0.55s;
    }

    /* Hills */
    .hill-back {
      position: absolute;
      right: -10%;
      bottom: 4%;
      left: -10%;
      z-index: 5;
      height: 25%;
      background: #0c1933;
      border-radius: 50% 50% 0 0 / 70% 70% 0 0;
    }

    .hills {
      position: absolute;
      right: -5%;
      bottom: -18%;
      left: -5%;
      z-index: 6;
      height: 38%;
      background: #020711;
      border-radius: 50% 50% 0 0 / 35% 35% 0 0;
    }

    @keyframes moonMove {
      0% {
        left: -140px;
        top: 28%;
        transform: scale(0.75);
      }

      45% {
        top: 8%;
        transform: scale(1);
      }

      100% {
        left: 110vw;
        top: 30%;
        transform: scale(0.75);
      }
    }

    @keyframes cloudMove {
      from {
        left: -420px;
      }

      to {
        left: 110vw;
      }
    }

    @keyframes shootingStar {
      0%,
      70% {
        left: -160px;
        opacity: 0;
      }

      75% {
        opacity: 1;
      }

      90%,
      100% {
        left: 110vw;
        opacity: 0;
      }
    }

    @keyframes sound {
      0%,
      100% {
        height: 16px;
        opacity: 0.7;
      }

      50% {
        height: 48px;
        opacity: 1;
      }
    }

    @keyframes twinkle {
      from {
        opacity: 0.4;
      }

      to {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .moon,
      .cloud,
      .shooting-star,
      .stars,
      .stars::before,
      .stars::after,
      .bar {
        animation: none;
      }

      .moon {
        left: 45%;
        top: 15%;
      }

      .cloud {
        left: 35%;
      }

      .bar {
        height: 30px;
      }
    }
  </style>
</head>

<body>
  <main class="sky">
    <div class="stars"></div>

    <div class="moon"></div>

    <div class="shooting-star"></div>

    <div class="cloud cloud-1">
      <div class="cloud-body"></div>
      <div class="puff puff-1"></div>
      <div class="puff puff-2"></div>
      <div class="puff puff-3"></div>
      <div class="puff puff-4"></div>
    </div>

    <div class="cloud cloud-2">
      <div class="cloud-body"></div>
      <div class="puff puff-1"></div>
      <div class="puff puff-2"></div>
      <div class="puff puff-3"></div>
      <div class="puff puff-4"></div>
    </div>

    <div class="cloud cloud-3">
      <div class="cloud-body"></div>
      <div class="puff puff-1"></div>
      <div class="puff puff-2"></div>
      <div class="puff puff-3"></div>
      <div class="puff puff-4"></div>
    </div>

    <div class="hill-back"></div>
    <div class="hills"></div>

    <div class="soundwave" aria-label="Animated sound wave">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>
  </main>
</body>
</html>
