<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Product Animation</title>

  <style>
    :root {
      --bg: #050506;
      --text: #f5f5f7;
      --muted: #8e8e93;
      --blue: #2997ff;
      --purple: #bf5af2;
      --cyan: #64d2ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Helvetica Neue", Arial, sans-serif;
    }

    .scene {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 40%, rgba(80, 80, 110, .16), transparent 28%),
        radial-gradient(circle at 20% 90%, rgba(41, 151, 255, .11), transparent 32%),
        linear-gradient(120deg, #030304, #0a0a0d 45%, #020203);
    }

    /* Soft cinematic light leaks */
    .light {
      position: absolute;
      width: 45vw;
      height: 45vw;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .22;
      pointer-events: none;
      z-index: -1;
      animation: drift 16s ease-in-out infinite alternate;
    }

    .light.one {
      top: -18vw;
      left: -10vw;
      background: var(--blue);
    }

    .light.two {
      right: -17vw;
      bottom: -20vw;
      background: var(--purple);
      animation-delay: -6s;
    }

    .light.three {
      top: 30%;
      left: 40%;
      width: 18vw;
      height: 18vw;
      background: var(--cyan);
      opacity: .1;
      animation-delay: -10s;
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(1100px, 90vw);
      text-align: center;
      transform: translateY(-3vh);
    }

    .eyebrow {
      margin-bottom: 22px;
      color: #b7b7bd;
      font-size: 12px;
      letter-spacing: .28em;
      text-transform: uppercase;
      opacity: 0;
      animation: reveal .9s .15s cubic-bezier(.2,.8,.2,1) forwards;
    }

    h1 {
      margin: 0;
      font-size: clamp(52px, 10vw, 150px);
      line-height: .88;
      letter-spacing: -.09em;
      font-weight: 700;
      background: linear-gradient(
        110deg,
        #fff 15%,
        #a8cfff 42%,
        #fff 55%,
        #c9a6ff 80%
      );
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation:
        reveal 1s .3s cubic-bezier(.2,.8,.2,1) forwards,
        shine 7s 1.3s linear infinite;
      opacity: 0;
    }

    .subtitle {
      max-width: 470px;
      margin: 28px auto 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 21px);
      line-height: 1.5;
      opacity: 0;
      animation: reveal .9s .55s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .button {
      display: inline-flex;
      margin-top: 34px;
      padding: 14px 24px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      box-shadow:
        inset 0 1px rgba(255,255,255,.17),
        0 12px 35px rgba(0,0,0,.3);
      backdrop-filter: blur(14px);
      opacity: 0;
      animation: reveal .9s .75s cubic-bezier(.2,.8,.2,1) forwards;
      transition: .35s ease;
    }

    .button:hover {
      transform: translateY(-3px) scale(1.04);
      background: rgba(255,255,255,.16);
      box-shadow: 0 18px 45px rgba(41,151,255,.2);
    }

    /* Product */
    .product-wrap {
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: -15vh;
      width: min(440px, 65vw);
      aspect-ratio: 1 / 1.45;
      transform: translateX(-50%) perspective(1000px) rotateX(58deg) rotateZ(-18deg);
      animation: productIn 1.8s .2s cubic-bezier(.16,1,.3,1) forwards,
                 hover 7s 2s ease-in-out infinite;
      filter: drop-shadow(0 50px 45px rgba(0,0,0,.7));
    }

    .product {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 42px;
      border: 1px solid rgba(255,255,255,.6);
      background:
        radial-gradient(circle at 25% 15%, rgba(255,255,255,.95), transparent 4%),
        radial-gradient(circle at 70% 10%, rgba(100,210,255,.8), transparent 22%),
        radial-gradient(circle at 25% 80%, rgba(191,90,242,.85), transparent 32%),
        linear-gradient(135deg, #d9e8ff, #4778db 42%, #17152d 78%, #09090e);
      box-shadow:
        inset 8px 8px 20px rgba(255,255,255,.28),
        inset -12px -15px 30px rgba(0,0,0,.5);
    }

    .product::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 35px;
      border: 1px solid rgba(255,255,255,.25);
    }

    .product::after {
      content: "";
      position: absolute;
      width: 170%;
      height: 18%;
      left: -35%;
      top: 38%;
      transform: rotate(-25deg);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.65),
        transparent
      );
      filter: blur(18px);
      animation: sweep 5s 2s ease-in-out infinite;
    }

    .camera {
      position: absolute;
      top: 11%;
      left: 9%;
      width: 25%;
      aspect-ratio: 1;
      border-radius: 28%;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.3);
      box-shadow: inset 3px 3px 8px rgba(255,255,255,.15);
    }

    .lens {
      position: absolute;
      width: 34%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #fff, #5a8bff 9%, #111 35%, #000 68%);
      border: 2px solid #111;
      box-shadow: 0 2px 8px #000;
    }

    .lens:nth-child(1) { top: 16%; left: 17%; }
    .lens:nth-child(2) { top: 55%; left: 17%; }
    .lens:nth-child(3) { top: 35%; left: 55%; }

    .reflection {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        transparent 30%,
        rgba(255,255,255,.2) 48%,
        transparent 60%
      );
      transform: translateX(-100%);
      animation: reflection 6s 2.5s ease-in-out infinite;
    }

    .floor-glow {
      position: absolute;
      bottom: -4vh;
      left: 50%;
      width: min(600px, 90vw);
      height: 90px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #317dff;
      filter: blur(70px);
      opacity: .25;
      animation: pulse 4s ease-in-out infinite;
    }

    .scroll {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: #777780;
      font-size: 10px;
      letter-spacing: .25em;
      text-transform: uppercase;
      animation: scrollHint 2.5s ease-in-out infinite;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(35px);
        filter: blur(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes productIn {
      from {
        opacity: 0;
        transform: translate(-50%, 35vh) perspective(1000px)
          rotateX(58deg) rotateZ(-18deg) scale(.75);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0) perspective(1000px)
          rotateX(58deg) rotateZ(-18deg) scale(1);
      }
    }

    @keyframes hover {
      0%, 100% { margin-bottom: 0; }
      50% { margin-bottom: 22px; }
    }

    @keyframes shine {
      to { background-position: 220% center; }
    }

    @keyframes sweep {
      0%, 45% { transform: translateX(-80%) rotate(-25deg); }
      70%, 100% { transform: translateX(80%) rotate(-25deg); }
    }

    @keyframes reflection {
      0%, 35% { transform: translateX(-100%); }
      70%, 100% { transform: translateX(100%); }
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(6vw, 4vh) scale(1.18); }
    }

    @keyframes pulse {
      0%, 100% { opacity: .18; transform: translateX(-50%) scaleX(.8); }
      50% { opacity: .35; transform: translateX(-50%) scaleX(1.1); }
    }

    @keyframes scrollHint {
      0%, 100% { opacity: .35; transform: translate(-50%, 0); }
      50% { opacity: .9; transform: translate(-50%, -6px); }
    }

    @media (max-width: 600px) {
      .product-wrap {
        bottom: -7vh;
        width: 68vw;
      }

      .content {
        transform: translateY(-13vh);
      }

      .subtitle {
        max-width: 320px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main class="scene">
    <div class="light one"></div>
    <div class="light two"></div>
    <div class="light three"></div>

    <section class="content">
      <div class="eyebrow">Designed for wonder</div>
      <h1>Beyond<br>beautiful.</h1>
      <p class="subtitle">
        A cinematic product moment built with nothing but HTML and CSS.
      </p>
      <a class="button" href="#explore">Explore the experience</a>
    </section>

    <div class="product-wrap" aria-label="Abstract premium smartphone">
      <div class="product">
        <div class="camera">
          <div class="lens"></div>
          <div class="lens"></div>
          <div class="lens"></div>
        </div>
        <div class="reflection"></div>
      </div>
    </div>

    <div class="floor-glow"></div>
    <div class="scroll">Scroll to explore</div>
  </main>
</body>
</html>
