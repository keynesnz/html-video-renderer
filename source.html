<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Premium Product Animation</title>

<style>
  :root {
    --bg: #050505;
    --text: #f5f5f7;
    --muted: #8d8d93;
    --blue: #9ccaff;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: #000;
    color: var(--text);
    font-family:
      Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display",
      "Segoe UI", sans-serif;
  }

  body {
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .ad {
    position: relative;
    width: min(100vw, 420px);
    aspect-ratio: 6 / 19;
    min-height: 100vh;
    max-height: 100vh;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(
        ellipse at 50% 35%,
        rgba(40, 80, 120, 0.24),
        transparent 42%
      ),
      linear-gradient(180deg, #101114 0%, #050505 58%, #000 100%);
  }

  /* Animated atmospheric glow */
  .ad::before {
    content: "";
    position: absolute;
    inset: -40%;
    z-index: -2;
    background:
      conic-gradient(
        from 180deg,
        transparent,
        rgba(110, 183, 255, 0.16),
        transparent 25%,
        rgba(255, 255, 255, 0.1),
        transparent 52%
      );
    filter: blur(70px);
    animation: atmosphere 12s ease-in-out infinite alternate;
  }

  .ad::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    background: radial-gradient(
      ellipse at center,
      transparent 45%,
      rgba(0, 0, 0, 0.54)
    );
  }

  .noise {
    position: absolute;
    inset: 0;
    z-index: 9;
    opacity: 0.035;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
  }

  .topbar {
    position: absolute;
    top: 5%;
    left: 8%;
    right: 8%;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.58);
  }

  .logo {
    color: white;
    font-size: 18px;
    letter-spacing: -0.08em;
  }

  .hero {
    position: absolute;
    inset: 16% 0 0;
    display: grid;
    place-items: center;
  }

  .headline {
    position: absolute;
    top: 8%;
    z-index: 4;
    width: 100%;
    text-align: center;
    animation: introText 1.8s cubic-bezier(.16, 1, .3, 1) both;
  }

  .eyebrow {
    margin-bottom: 18px;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--blue);
  }

  h1 {
    margin: 0;
    font-size: clamp(42px, 14vw, 70px);
    line-height: 0.86;
    letter-spacing: -0.075em;
    font-weight: 600;
  }

  h1 span {
    display: block;
  }

  .product-stage {
    position: relative;
    width: 74%;
    aspect-ratio: 0.62;
    margin-top: 22%;
    perspective: 900px;
    animation: stageIn 2s cubic-bezier(.16, 1, .3, 1) both;
  }

  .halo {
    position: absolute;
    top: 26%;
    left: 50%;
    width: 115%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(100, 178, 255, 0.17);
    filter: blur(45px);
    animation: pulse 4s ease-in-out infinite;
  }

  .device {
    position: absolute;
    top: 4%;
    left: 50%;
    width: 71%;
    height: 72%;
    transform: translateX(-50%) rotateY(-18deg) rotateZ(4deg);
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: 28px;
    background:
      linear-gradient(
        115deg,
        rgba(255,255,255,.35),
        transparent 17% 65%,
        rgba(255,255,255,.12)
      ),
      linear-gradient(135deg, #24272c, #070809 55%, #353941);
    box-shadow:
      -28px 30px 55px rgba(0, 0, 0, 0.9),
      inset 8px 0 15px rgba(255, 255, 255, 0.1),
      inset -8px 0 15px rgba(0, 0, 0, 0.7);
    animation: float 5s ease-in-out 2s infinite;
  }

  .device::before {
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 21px;
    background:
      radial-gradient(circle at 58% 32%, rgba(124, 200, 255, .82), transparent 2%),
      radial-gradient(circle at 50% 48%, rgba(55, 123, 204, .6), transparent 23%),
      linear-gradient(150deg, #0a1623, #06101b 45%, #020304);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
  }

  .device::after {
    content: "";
    position: absolute;
    top: 17px;
    left: 50%;
    width: 32%;
    height: 8px;
    transform: translateX(-50%);
    border-radius: 20px;
    background: #020303;
  }

  .shine {
    position: absolute;
    inset: -20% -80%;
    z-index: 2;
    transform: rotate(25deg) translateX(-100%);
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.34),
      transparent
    );
    animation: shine 5s ease-in-out 2s infinite;
  }

  .orbit {
    position: absolute;
    top: 16%;
    left: 50%;
    width: 112%;
    height: 55%;
    transform: translateX(-50%) rotate(-25deg);
    border: 1px solid rgba(145, 204, 255, 0.3);
    border-radius: 50%;
    animation: orbit 7s linear infinite;
  }

  .orbit::after {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 22px 7px #8ecbff;
  }

  .specs {
    position: absolute;
    bottom: 1%;
    left: 0;
    right: 0;
    text-align: center;
    animation: introText 1.8s 1s cubic-bezier(.16, 1, .3, 1) both;
  }

  .specs p {
    margin: 0 0 12px;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.72);
  }

  .cta {
    display: inline-block;
    padding: 11px 18px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: white;
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(12px);
  }

  @keyframes atmosphere {
    to {
      transform: rotate(100deg) scale(1.2);
    }
  }

  @keyframes introText {
    from {
      opacity: 0;
      transform: translateY(35px);
      filter: blur(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
  }

  @keyframes stageIn {
    from {
      opacity: 0;
      transform: scale(.75) translateY(100px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  @keyframes float {
    0%, 100% {
      margin-top: 0;
    }
    50% {
      margin-top: -17px;
    }
  }

  @keyframes pulse {
    0%, 100% {
      opacity: .42;
      transform: translate(-50%, -50%) scale(.92);
    }
    50% {
      opacity: .85;
      transform: translate(-50%, -50%) scale(1.12);
    }
  }

  @keyframes shine {
    0%, 35% {
      transform: rotate(25deg) translateX(-100%);
    }
    70%, 100% {
      transform: rotate(25deg) translateX(100%);
    }
  }

  @keyframes orbit {
    to {
      transform: translateX(-50%) rotate(335deg);
    }
  }

  @media (min-width: 600px) {
    .ad {
      min-height: 0;
      height: 95vh;
      border-radius: 22px;
      box-shadow: 0 30px 100px #000;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>

<body>
  <main class="ad">
    <div class="noise"></div>

    <header class="topbar">
      <div class="logo">◉</div>
      <div>Introducing</div>
    </header>

    <section class="hero">
      <div class="headline">
        <div class="eyebrow">Beyond the ordinary</div>
        <h1>
          <span>Pure</span>
          <span>motion.</span>
        </h1>
      </div>

      <div class="product-stage">
        <div class="halo"></div>
        <div class="orbit"></div>

        <div class="device">
          <div class="shine"></div>
        </div>

        <div class="specs">
          <p>Designed to disappear into your world.</p>
          <span class="cta">Discover more</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
