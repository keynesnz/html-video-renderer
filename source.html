<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated HDR Burgundy Wallpaper</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #030005;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .preview {
      position: relative;
      width: min(100vw, 56.25vh);
      aspect-ratio: 2160 / 3840;
      overflow: hidden;
      background: #030005;
      box-shadow: 0 0 80px rgba(255, 25, 115, 0.2);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .content {
      position: absolute;
      z-index: 10;
      left: 8%;
      right: 8%;
      bottom: 8%;
      text-align: center;
      color: white;
    }

    h1 {
      margin: 0 0 12px;
      color: #ffe0eb;
      font-size: clamp(22px, 5vw, 60px);
      font-weight: 300;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-shadow:
        0 0 12px #ff3e88,
        0 0 30px rgba(255, 62, 136, 0.9);
    }

    p {
      margin: 0 0 24px;
      color: rgba(255, 230, 240, 0.8);
      font-size: clamp(11px, 2vw, 18px);
    }

    button {
      border: 1px solid #ff9abd;
      border-radius: 6px;
      padding: 15px 28px;
      color: white;
      background: linear-gradient(135deg, #92133e, #ed3476);
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow:
        0 0 14px rgba(255, 48, 125, 0.9),
        0 0 38px rgba(255, 48, 125, 0.4);
      transition: 0.25s ease;
    }

    button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow:
        0 0 20px #ff3e88,
        0 0 60px rgba(255, 48, 125, 0.75);
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    #status {
      min-height: 20px;
      margin-top: 15px;
      color: #ffc2d8;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="preview">
    <canvas id="wallpaper"></canvas>

    <section class="content">
      <h1>HDR Burgundy</h1>
      <p>Animated wallpaper · 2160 × 3840 px</p>

      <button id="downloadButton">
        Download MP4
      </button>

      <div id="status"></div>
    </section>
  </main>

  <script type="module">
    import { FFmpeg } from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/+esm";
    import { toBlobURL } from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/+esm";

    const canvas = document.getElementById("wallpaper");
    const ctx = canvas.getContext("2d", {
      alpha: false,
      colorSpace: "srgb",
      desynchronized: false
    });

    const button = document.getElementById("downloadButton");
    const statusText = document.getElementById("status");

    /*
      Resolusi output.
      Jangan diubah jika ingin output 2160 × 3840.
    */
    const WIDTH = 2160;
    const HEIGHT = 3840;

    const FPS = 30;
    const DURATION_SECONDS = 10;
    const TOTAL_FRAMES = FPS * DURATION_SECONDS;

    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    let animationFrame;
    let startTime = performance.now();

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function drawBackground(time) {
      const pulse = Math.sin(time * 0.0012) * 0.5 + 0.5;

      const background = ctx.createRadialGradient(
        WIDTH * 0.5,
        HEIGHT * (0.29 + pulse * 0.025),
        0,
        WIDTH * 0.5,
        HEIGHT * 0.45,
        HEIGHT * 0.87
      );

      background.addColorStop(0, "#b7356e");
      background.addColorStop(0.25, "#71183e");
      background.addColorStop(0.57, "#350a1c");
      background.addColorStop(1, "#0b0107");

      ctx.fillStyle = background;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      const glowRadius = WIDTH * (0.65 + pulse * 0.16);

      const centerGlow = ctx.createRadialGradient(
        WIDTH * 0.5,
        HEIGHT * 0.28,
        0,
        WIDTH * 0.5,
        HEIGHT * 0.28,
        glowRadius
      );

      centerGlow.addColorStop(
        0,
        `rgba(255, 73, 139, ${0.42 + pulse * 0.18})`
      );

      centerGlow.addColorStop(
        0.3,
        "rgba(211, 37, 99, 0.25)"
      );

      centerGlow.addColorStop(
        1,
        "rgba(211, 37, 99, 0)"
      );

      ctx.fillStyle = centerGlow;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      const lowerGlow = ctx.createRadialGradient(
        WIDTH * (0.82 + Math.sin(time * 0.0005) * 0.08),
        HEIGHT * 0.82,
        0,
        WIDTH * 0.82,
        HEIGHT * 0.82,
        WIDTH * 0.8
      );

      lowerGlow.addColorStop(
        0,
        "rgba(155, 17, 65, 0.62)"
      );

      lowerGlow.addColorStop(
        1,
        "rgba(55, 2, 20, 0)"
      );

      ctx.fillStyle = lowerGlow;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
    }

    function drawCrystal(x, y, w, h, rotation, opacity, time) {
      ctx.save();

      const movementX = Math.sin(time * 0.00035 + x) * 18;
      const movementY = Math.cos(time * 0.0004 + y) * 20;
      const rotationAnimation =
        Math.sin(time * 0.00025 + x) * 0.7;

      ctx.translate(x + movementX, y + movementY);
      ctx.rotate(((rotation + rotationAnimation) * Math.PI) / 180);
      ctx.transform(1, 0, -0.12, 1, 0, 0);

      const crystalGradient = ctx.createLinearGradient(
        0,
        0,
        w,
        h
      );

      crystalGradient.addColorStop(
        0,
        `rgba(255, 100, 160, ${opacity})`
      );

      crystalGradient.addColorStop(
        0.45,
        "rgba(255, 255, 255, 0.035)"
      );

      crystalGradient.addColorStop(
        1,
        "rgba(0, 0, 0, 0.32)"
      );

      ctx.fillStyle = crystalGradient;
      ctx.strokeStyle = "rgba(255, 197, 220, 0.42)";
      ctx.lineWidth = 3;

      ctx.shadowColor = "rgba(255, 42, 125, 0.28)";
      ctx.shadowBlur = 55;

      ctx.beginPath();
      ctx.moveTo(0, h * 0.2);
      ctx.lineTo(w * 0.23, 0);
      ctx.lineTo(w, h * 0.22);
      ctx.lineTo(w * 0.77, h);
      ctx.lineTo(0, h * 0.8);
      ctx.closePath();

      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawBeam(y, angle, opacity, thickness, time) {
      ctx.save();

      const animatedY =
        y + Math.sin(time * 0.001 + y) * 26;

      ctx.translate(WIDTH / 2, animatedY);
      ctx.rotate((angle * Math.PI) / 180);

      const beamGradient = ctx.createLinearGradient(
        -WIDTH,
        0,
        WIDTH,
        0
      );

      const beamPulse =
        opacity *
        (0.75 + Math.sin(time * 0.002 + y) * 0.25);

      beamGradient.addColorStop(
        0,
        "rgba(255, 48, 125, 0)"
      );

      beamGradient.addColorStop(
        0.25,
        `rgba(255, 48, 125, ${beamPulse})`
      );

      beamGradient.addColorStop(
        0.5,
        "rgba(255, 220, 235, 1)"
      );

      beamGradient.addColorStop(
        0.75,
        `rgba(255, 48, 125, ${beamPulse})`
      );

      beamGradient.addColorStop(
        1,
        "rgba(255, 48, 125, 0)"
      );

      ctx.fillStyle = beamGradient;
      ctx.shadowColor = "#ff287a";
      ctx.shadowBlur = 35;

      ctx.fillRect(
        -WIDTH,
        0,
        WIDTH * 2,
        thickness
      );

      ctx.restore();
    }

    function drawStar(x, y, radius, time, index) {
      const scale =
        0.8 +
        Math.sin(time * 0.002 + index * 1.4) * 0.35;

      const r = radius * scale;

      const starGlow = ctx.createRadialGradient(
        x,
        y,
        0,
        x,
        y,
        r * 8
      );

      starGlow.addColorStop(
        0,
        "rgba(255, 255, 255, 1)"
      );

      starGlow.addColorStop(
        0.1,
        "rgba(255, 173, 205, 1)"
      );

      starGlow.addColorStop(
        1,
        "rgba(255, 36, 116, 0)"
      );

      ctx.fillStyle = starGlow;
      ctx.beginPath();
      ctx.arc(x, y, r * 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawGrid() {
      ctx.save();

      ctx.globalAlpha = 0.1;
      ctx.strokeStyle = "#ffb4cf";
      ctx.lineWidth = 2;

      const gridSize = 90;

      for (let x = 0; x <= WIDTH; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, HEIGHT * 0.12);
        ctx.lineTo(x, HEIGHT * 0.88);
        ctx.stroke();
      }

      for (
        let y = HEIGHT * 0.12;
        y <= HEIGHT * 0.88;
        y += gridSize
      ) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WIDTH, y);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawVignette() {
      const vignette = ctx.createRadialGradient(
        WIDTH / 2,
        HEIGHT / 2,
        WIDTH * 0.18,
        WIDTH / 2,
        HEIGHT / 2,
        HEIGHT * 0.78
      );

      vignette.addColorStop(
        0,
        "rgba(0, 0, 0, 0)"
      );

      vignette.addColorStop(
        0.72,
        "rgba(0, 0, 0, 0.13)"
      );

      vignette.addColorStop(
        1,
        "rgba(0, 0, 0, 0.72)"
      );

      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
    }

    function drawGrain() {
      /*
        Grain dibuat ringan supaya encoding MP4
        tidak menghasilkan file terlalu besar.
      */
      ctx.save();

      ctx.globalAlpha = 0.045;

      for (let i = 0; i < 1400; i++) {
        const x = Math.random() * WIDTH;
        const y = Math.random() * HEIGHT;
        const size = Math.random() * 3 + 1;

        ctx.fillStyle =
          Math.random() > 0.5
            ? "#ffffff"
            : "#000000";

        ctx.fillRect(x, y, size, size);
      }

      ctx.restore();
    }

    function render(time) {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      drawBackground(time);

      drawCrystal(
        -WIDTH * 0.27,
        HEIGHT * 0.1,
        WIDTH * 0.82,
        HEIGHT * 0.27,
        30,
        0.18,
        time
      );

      drawCrystal(
        WIDTH * 0.4,
        HEIGHT * 0.36,
        WIDTH * 0.9,
        HEIGHT * 0.29,
        -32,
        0.15,
        time
      );

      drawCrystal(
        -WIDTH * 0.2,
        HEIGHT * 0.63,
        WIDTH * 0.78,
        HEIGHT * 0.23,
        25,
        0.1,
        time
      );

      drawBeam(
        HEIGHT * 0.395,
        -30,
        1,
        7,
        time
      );

      drawBeam(
        HEIGHT * 0.415,
        -30,
        0.42,
        2,
        time
      );

      drawBeam(
        HEIGHT * 0.7,
        24,
        0.45,
        5,
        time
      );

      drawStar(
        WIDTH * 0.22,
        HEIGHT * 0.17,
        10,
        time,
        1
      );

      drawStar(
        WIDTH * 0.82,
        HEIGHT * 0.28,
        9,
        time,
        2
      );

      drawStar(
        WIDTH * 0.2,
        HEIGHT * 0.63,
        8,
        time,
        3
      );

      drawStar(
        WIDTH * 0.76,
        HEIGHT * 0.8,
        9,
        time,
        4
      );

      drawGrid();
      drawGrain();
      drawVignette();

      animationFrame = requestAnimationFrame(render);
    }

    function sleep(ms) {
      return new Promise(resolve => {
        setTimeout(resolve, ms);
      });
    }

    async function loadFFmpeg() {
      const ffmpeg = new FFmpeg();

      ffmpeg.on("progress", ({ progress }) => {
        const percent = Math.round(progress * 100);
        statusText.textContent =
          `Mengonversi ke MP4: ${percent}%`;
      });

      const baseURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd";

      await ffmpeg.load({
        coreURL: await toBlobURL(
          `${baseURL}/ffmpeg-core.js`,
          "text/javascript"
        ),

        wasmURL: await toBlobURL(
          `${baseURL}/ffmpeg-core.wasm`,
          "application/wasm"
        )
      });

      return ffmpeg;
    }

    async function recordAnimation() {
      const stream = canvas.captureStream(FPS);

      /*
        WebM digunakan sebagai format rekaman sementara
        karena MediaRecorder browser umumnya merekam
        canvas ke WebM. Setelah itu FFmpeg mengubahnya
        menjadi MP4 H.264.
      */
      const recorder = new MediaRecorder(stream, {
        mimeType: "video/webm;codecs=vp9",
        videoBitsPerSecond: 45_000_000
      });

      const chunks = [];

      recorder.ondataavailable = event => {
        if (event.data && event.data.size > 0) {
          chunks.push(event.data);
        }
      };

      const stopped = new Promise(resolve => {
        recorder.onstop = resolve;
      });

      recorder.start(1000);

      const frameDuration = 1000 / FPS;

      for (let frame = 0; frame < TOTAL_FRAMES; frame++) {
        const time = frame * frameDuration;

        render(time);

        /*
          Memberi waktu browser untuk merekam frame.
          Promise ini membantu menjaga jumlah frame
          tetap mendekati FPS yang ditentukan.
        */
        await sleep(frameDuration);
      }

      recorder.stop();
      await stopped;

      stream.getTracks().forEach(track => {
        track.stop();
      });

      return new Blob(chunks, {
        type: "video/webm"
      });
    }

    async function convertToMP4(webmBlob) {
      statusText.textContent =
        "Memuat encoder MP4...";

      const ffmpeg = await loadFFmpeg();

      const inputData =
        new Uint8Array(
          await webmBlob.arrayBuffer()
        );

      await ffmpeg.writeFile(
        "input.webm",
        inputData
      );

      statusText.textContent =
        "Encoding MP4 kualitas tinggi...";

      await ffmpeg.exec([
        "-i",
        "input.webm",

        "-c:v",
        "libx264",

        "-preset",
        "slow",

        "-crf",
        "16",

        "-pix_fmt",
        "yuv420p",

        "-movflags",
        "+faststart",

        "-r",
        String(FPS),

        "-an",

        "hdr-burgundy-wallpaper-2160x3840.mp4"
      ]);

      const outputData = await ffmpeg.readFile(
        "hdr-burgundy-wallpaper-2160x3840.mp4"
      );

      return new Blob(
        [outputData.buffer],
        {
          type: "video/mp4"
        }
      );
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = filename;

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 3000);
    }

    button.addEventListener("click", async () => {
      button.disabled = true;
      statusText.textContent =
        "Merekam animasi 2160 × 3840...";

      try {
        cancelAnimationFrame(animationFrame);

        const webmBlob = await recordAnimation();
        const mp4Blob = await convertToMP4(webmBlob);

        downloadBlob(
          mp4Blob,
          "hdr-burgundy-wallpaper-2160x3840.mp4"
        );

        statusText.textContent =
          "MP4 selesai dan sedang diunduh.";
      } catch (error) {
        console.error(error);

        statusText.textContent =
          "Gagal membuat MP4. Cek Console browser.";

        alert(
          "Encoding gagal. Resolusi 2160 × 3840 membutuhkan RAM dan CPU besar."
        );
      } finally {
        button.disabled = false;
        startTime = performance.now();
        animationFrame = requestAnimationFrame(render);
      }
    });

    animationFrame = requestAnimationFrame(render);
  </script>
</body>
</html>
