<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Community Shield — Coming Soon</title>

<style>

/* =========================================================
   FONT
========================================================= */

@import url(
    'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap'
);


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================================================
   PAGE
========================================================= */

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #030303;
}


body {

    font-family:
        "Inter",
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        sans-serif;

    color: #fff;

    -webkit-font-smoothing: antialiased;

    text-rendering: optimizeLegibility;
}


/* =========================================================
   FULL SCREEN
========================================================= */

.canvas {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100dvh;

    overflow: hidden;

    background: #030303;
}


/* =========================================================
   HERO
========================================================= */

.hero {

    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,.10),
            transparent 30%
        ),

        radial-gradient(
            circle at 10% 85%,
            rgba(30,70,255,.15),
            transparent 38%
        ),

        radial-gradient(
            circle at 90% 15%,
            rgba(255,30,60,.10),
            transparent 35%
        ),

        #030303;
}


/* =========================================================
   HUGE BACKGROUND GLOW
========================================================= */

.hero::before {

    content: "";

    position: absolute;

    width: 75vmin;
    height: 75vmin;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:

        conic-gradient(
            from 180deg,
            transparent,
            rgba(255,255,255,.06),
            rgba(80,110,255,.20),
            transparent,
            rgba(255,40,70,.08),
            transparent
        );

    filter: blur(60px);

    animation:
        rotate 16s linear infinite;

    pointer-events: none;
}


@keyframes rotate {

    from {

        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    to {

        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }
}


/* =========================================================
   GRAIN
========================================================= */

.hero::after {

    content: "";

    position: absolute;

    inset: 0;

    opacity: .045;

    pointer-events: none;

    background-image:

        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
}


/* =========================================================
   MAIN CONTENT
========================================================= */

.content {

    position: relative;

    z-index: 5;

    width: 100%;

    max-width: 1500px;

    padding:
        5vw;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    transform:
        translateY(-3vh);

    animation:
        reveal 1.2s cubic-bezier(.16,1,.3,1) forwards;
}


@keyframes reveal {

    from {

        opacity: 0;

        transform:
            translateY(25px)
            scale(.97);
    }

    to {

        opacity: 1;

        transform:
            translateY(-3vh)
            scale(1);
    }
}


/* =========================================================
   EYEBROW
========================================================= */

.eyebrow {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 9px;

    padding:
        9px 16px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 999px;

    background:
        rgba(255,255,255,.055);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    color:
        rgba(255,255,255,.65);

    font-size:
        clamp(9px, 1.2vw, 12px);

    font-weight: 600;

    letter-spacing: .15em;

    text-transform: uppercase;

    margin-bottom:
        clamp(18px, 3vh, 30px);
}


/* =========================================================
   GREEN DOT
========================================================= */

.dot {

    width: 7px;
    height: 7px;

    flex-shrink: 0;

    border-radius: 50%;

    background: #38ff7b;

    box-shadow:
        0 0 15px #38ff7b;

    animation:
        pulse 1.8s ease-in-out infinite;
}


@keyframes pulse {

    0%,
    100% {

        opacity: .45;

        transform: scale(.8);

        box-shadow:
            0 0 5px #38ff7b;
    }

    50% {

        opacity: 1;

        transform: scale(1.2);

        box-shadow:
            0 0 20px #38ff7b;
    }
}


/* =========================================================
   GIANT TITLE
========================================================= */

/*
   THIS IS THE IMPORTANT PART.

   The title uses BOTH viewport width and height.

   It automatically grows according to the device.

   Small phone:
       ~15vw

   Large phone:
       ~18vw

   Desktop:
       up to 170px
*/

h1 {

    width: 100%;

    font-size:
        clamp(
            55px,
            min(18vw, 17vh),
            170px
        );

    line-height: .82;

    letter-spacing:
        -.075em;

    font-weight: 800;

    margin: 0;

    white-space: nowrap;

    background:

        linear-gradient(
            180deg,
            #ffffff 0%,
            #eeeeee 38%,
            #707070 100%
        );

    -webkit-background-clip: text;

    background-clip: text;

    -webkit-text-fill-color: transparent;

    filter:
        drop-shadow(
            0 20px 45px
            rgba(0,0,0,.65)
        );
}


/* =========================================================
   SHIELD WORD
========================================================= */

h1 span {

    display: block;

    background:

        linear-gradient(
            90deg,
            #ffffff 0%,
            #8da2ff 45%,
            #ffffff 70%,
            #ffffff 100%
        );

    background-size:
        250% auto;

    -webkit-background-clip: text;

    background-clip: text;

    -webkit-text-fill-color:
        transparent;

    animation:
        shine 5s linear infinite;
}


@keyframes shine {

    to {

        background-position:
            250% center;
    }
}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle {

    margin-top:
        clamp(22px, 3.5vh, 38px);

    width: 100%;

    max-width: 700px;

    color:
        rgba(255,255,255,.58);

    font-size:
        clamp(
            14px,
            2.5vw,
            21px
        );

    line-height:
        1.45;

    letter-spacing:
        -.025em;
}


/* =========================================================
   DATE / TYPING
========================================================= */

.date {

    margin-top:
        clamp(25px, 4vh, 45px);

    display: flex;

    justify-content: center;

    align-items: center;
}


.date-value {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-height: 25px;

    color: #fff;

    font-size:
        clamp(
            15px,
            2.5vw,
            20px
        );

    font-weight: 600;

    letter-spacing:
        -.02em;

    text-shadow:
        0 0 20px
        rgba(255,255,255,.2);
}


/* =========================================================
   CURSOR
========================================================= */

.cursor {

    display: inline-block;

    width: 2px;

    height:
        clamp(17px, 2.5vw, 21px);

    margin-left: 2px;

    border-radius: 999px;

    background:

        linear-gradient(
            180deg,
            #ffffff,
            #9db2ff,
            #ffffff
        );

    box-shadow:

        0 0 5px
        rgba(255,255,255,.9),

        0 0 12px
        rgba(120,150,255,.8),

        0 0 22px
        rgba(100,130,255,.4);

    animation:
        cursorGlow 1.1s ease-in-out infinite;
}


@keyframes cursorGlow {

    0%,
    100% {

        opacity: .35;

        transform:
            scaleY(.82);
    }

    50% {

        opacity: 1;

        transform:
            scaleY(1);
    }
}


/* =========================================================
   PHONE PORTRAIT
========================================================= */

@media (max-width: 600px) {

    .content {

        padding:
            20px;

        transform:
            translateY(-4vh);
    }


    @keyframes reveal {

        from {

            opacity: 0;

            transform:
                translateY(calc(-4vh + 25px))
                scale(.97);
        }

        to {

            opacity: 1;

            transform:
                translateY(-4vh)
                scale(1);
        }
    }


    /*
       Make the title VERY BIG on phones.
    */

    h1 {

        font-size:
            clamp(
                58px,
                17vw,
                110px
            );

        letter-spacing:
            -.08em;
    }


    .subtitle {

        max-width:
            380px;

        font-size:
            clamp(
                14px,
                4vw,
                17px
            );
    }


    .date {

        margin-top:
            25px;
    }

}


/* =========================================================
   SMALL PHONE
========================================================= */

@media (max-width: 380px) {

    h1 {

        font-size:
            16.5vw;
    }


    .eyebrow {

        margin-bottom:
            17px;

        padding:
            7px 12px;
    }


    .subtitle {

        margin-top:
            20px;

        font-size:
            14px;
    }
}


/* =========================================================
   LANDSCAPE PHONE
========================================================= */

@media
(orientation: landscape)
and (max-height: 600px) {

    .content {

        padding:
            15px;

        transform:
            translateY(0);
    }


    @keyframes reveal {

        from {

            opacity: 0;

            transform:
                translateY(20px)
                scale(.97);
        }

        to {

            opacity: 1;

            transform:
                translateY(0)
                scale(1);
        }
    }


    .eyebrow {

        margin-bottom:
            12px;

        padding:
            6px 12px;
    }


    h1 {

        font-size:
            clamp(
                45px,
                15vh,
                100px
            );
    }


    .subtitle {

        margin-top:
            15px;

        font-size:
            14px;
    }


    .date {

        margin-top:
            15px;
    }
}


/* =========================================================
   TABLET / DESKTOP
========================================================= */

@media (min-width: 601px) {

    h1 {

        /*
           Allow title to become
           genuinely huge.
        */

        font-size:
            clamp(
                80px,
                14vw,
                170px
            );
    }
}


/* =========================================================
   VERY LARGE SCREENS
========================================================= */

@media (min-width: 1400px) {

    h1 {

        font-size:
            min(14vw, 180px);
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;
    }
}

</style>

</head>


<body>


<div class="canvas">

    <section class="hero">

        <main class="content">


            <!-- STATUS -->

            <div class="eyebrow">

                <span class="dot"></span>

                The season begins

            </div>


            <!-- GIANT TITLE -->

            <h1>

                Community

                <span>
                    Shield.
                </span>

            </h1>


            <!-- SUBTITLE -->

            <p class="subtitle">

                One match. One champion.

                <br>

                The FA Community Shield.

            </p>


            <!-- TYPING -->

            <div class="date">

                <div class="date-value">

                    <span id="typing"></span>

                    <span class="cursor"></span>

                </div>

            </div>


        </main>

    </section>

</div>


<!-- =========================================================
     TYPING ANIMATION
========================================================= -->

<script>

const text = "This weekend";

const typing =
    document.getElementById("typing");

let index = 0;

let deleting = false;


function typeEffect() {

    if (!deleting) {

        typing.textContent =
            text.substring(
                0,
                index + 1
            );

        index++;


        if (index === text.length) {

            setTimeout(() => {

                deleting = true;

                typeEffect();

            }, 1800);

            return;
        }


        setTimeout(
            typeEffect,
            110
        );

        return;
    }


    typing.textContent =
        text.substring(
            0,
            index - 1
        );

    index--;


    if (index === 0) {

        deleting = false;

        setTimeout(
            typeEffect,
            400
        );

        return;
    }


    setTimeout(
        typeEffect,
        65
    );
}


typeEffect();

</script>


<!-- =========================================================
     BACKGROUND MUSIC
========================================================= -->

<audio
    id="bgMusic"
    autoplay
    loop
    preload="auto"
>

    <source
        src="https://github.com/keynesnz/datawaster.github.io/raw/refs/heads/main/mixkit-punked-up-fun-47.mp3"
        type="audio/mpeg"
    >

</audio>


<script>

window.addEventListener(
    "load",
    function () {

        const music =
            document.getElementById(
                "bgMusic"
            );

        music.play().catch(
            function () {

                console.log(
                    "Autoplay diblokir oleh browser."
                );

            }
        );

    }
);

</script>


</body>

</html>
