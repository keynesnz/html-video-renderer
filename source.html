<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Premier League — Mirror Flip Reveal</title>
<style>
  /* ===== EDIT THIS ONE LINE TO CHANGE THE BACKGROUND COLOR ===== */
  :root {
    --bg-color: #00FF00; /* standard chroma-key green for greenscreen */
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg-color);
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
  }

  .glow {
    position: absolute;
    width: 60vw;
    height: 60vw;
    max-width: 700px;
    max-height: 700px;
    background: radial-gradient(circle, rgba(47,128,255,0.18) 0%, rgba(55,0,60,0) 70%);
    border-radius: 50%;
    animation: glowPulse 2.4s ease-out forwards;
  }

  @keyframes glowPulse {
    0%   { opacity: 0; transform: scale(0.4); }
    35%  { opacity: 1; }
    100% { opacity: 0.6; transform: scale(1); }
  }

  .word {
    position: relative;
    display: flex;
    gap: 0.02em;
  }

  /* Apple-style type: tight tracking, heavy weight, no letterspacing tricks */
  #premier .letter {
    font-weight: 700;
    font-size: clamp(1.5rem, 5.5vw, 4rem);
    letter-spacing: -0.03em;
    color: #FFFFFF;
    opacity: 0;
    transform: translateY(18px);
    animation: fadeUp 0.6s cubic-bezier(0.2,1,0.3,1) forwards;
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  #league .letter {
    display: inline-block;
    font-weight: 800;
    font-size: clamp(2.4rem, 10vw, 8rem);
    letter-spacing: -0.04em;
    color: #6FC3FF;
    text-shadow: 0 0 36px rgba(111,195,255,0.45);
    transform-origin: 50% 50%;
    transform: scaleX(-1);
    animation-name: unflip;
    animation-duration: 0.65s;
    animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    animation-fill-mode: forwards;
  }

  @keyframes unflip {
    0% {
      transform: scaleX(-1) rotateY(0deg);
    }
    50% {
      transform: scaleX(0) rotateY(90deg);
    }
    100% {
      transform: scaleX(1) rotateY(0deg);
    }
  }

  .bar {
    width: 0;
    height: 5px;
    background: linear-gradient(90deg, #FFFFFF, #6FC3FF);
    border-radius: 3px;
    animation: barGrow 0.6s ease-out forwards;
    animation-delay: 2.4s;
    opacity: 0;
  }

  @keyframes barGrow {
    0%   { width: 0; opacity: 0; }
    10%  { opacity: 1; }
    100% { width: min(60vw, 420px); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    #premier .letter, #league .letter, .bar, .glow {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
      width: auto !important;
    }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <div class="word" id="premier"></div>
    <div class="word" id="league"></div>
    <div class="bar"></div>
  </div>

  <script>
    const premierText = "PREMIER";
    const leagueText = "LEAGUE";

    const premierEl = document.getElementById('premier');
    const leagueEl = document.getElementById('league');

    [...premierText].forEach((ch, i) => {
      const span = document.createElement('span');
      span.textContent = ch;
      span.className = 'letter';
      span.style.animationDelay = (i * 0.04) + 's';
      premierEl.appendChild(span);
    });

    const premierDuration = premierText.length * 0.04 + 0.6;
    [...leagueText].forEach((ch, i) => {
      const span = document.createElement('span');
      span.textContent = ch;
      span.className = 'letter';
      span.style.animationDelay = (premierDuration + 0.3 + i * 0.16) + 's';
      leagueEl.appendChild(span);
    });

    function replay() {
      document.querySelectorAll('#premier .letter, #league .letter').forEach(el => {
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = '';
      });
      const bar = document.querySelector('.bar');
      bar.style.animation = 'none';
      void bar.offsetWidth;
      bar.style.animation = '';
      const glow = document.querySelector('.glow');
      glow.style.animation = 'none';
      void glow.offsetWidth;
      glow.style.animation = '';
    }
    setInterval(replay, 5000);
  </script>
</body>
</html>
