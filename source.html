<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FA Community Shield — Premium Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  html, body {
    background: #000;
    color: #fff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ===== STAGE: 9:16 / 1080x1920 ===== */
  .stage {
    position: relative;
    width: min(100vw, calc(100vh * 9 / 16));
    height: min(100vh, calc(100vw * 16 / 9));
    overflow: hidden;
    background: #050505;
    isolation: isolate;
  }

  /* ===== AMBIENT BACKGROUND BLOBS ===== */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.55;
    will-change: transform;
    mix-blend-mode: screen;
  }
  .blob-1 {
    width: 70%;
    height: 35%;
    background: radial-gradient(circle, #ef0107 0%, transparent 65%);
    top: 12%;
    left: -25%;
    animation: float1 14s ease-in-out infinite;
  }
  .blob-2 {
    width: 70%;
    height: 35%;
    background: radial-gradient(circle, #6cabdd 0%, transparent 65%);
    bottom: 16%;
    right: -25%;
    animation: float2 17s ease-in-out infinite;
  }
  .blob-3 {
    width: 55%;
    height: 30%;
    background: radial-gradient(circle, #d4af37 0%, transparent 65%);
    top: 48%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.25;
    filter: blur(110px);
    animation: float3 20s ease-in-out infinite;
  }
  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(20%, 8%) scale(1.1); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-20%, -8%) scale(1.1); }
  }
  @keyframes float3 {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.15); }
  }

  /* ===== GRAIN ===== */
  .grain {
    position: absolute;
    inset: -10%;
    opacity: 0.10;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
    will-change: transform;
    animation: grain 0.5s steps(4) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-2%, 1%); }
    50% { transform: translate(1%, -2%); }
    75% { transform: translate(-1%, 2%); }
    100% { transform: translate(2%, -1%); }
  }

  /* ===== VIGNETTE ===== */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* ===== SCENE ===== */
  .scene {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 7vh 8vw;
    z-index: 3;
  }

  /* ===== SHIELD EMBLEM ===== */
  .emblem-wrap {
    margin-bottom: 4vh;
    opacity: 0;
    transform: scale(0.6) rotate(-8deg);
    animation: emblemIn 1.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
  }
  @keyframes emblemIn {
    to { opacity: 1; transform: scale(1) rotate(0); }
  }
  .emblem {
    width: 18vw;
    max-width: 90px;
    height: auto;
    display: block;
    filter: drop-shadow(0 8px 30px rgba(212,175,55,0.5));
  }

  /* ===== EYEBROW ===== */
  .eyebrow {
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: #d4af37;
    margin-bottom: 3vh;
    opacity: 0;
    transform: translateY(20px);
    animation: eyebrowIn 1s ease 0.6s forwards;
    text-shadow: 0 0 20px rgba(212,175,55,0.4);
  }
  @keyframes eyebrowIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== HEADLINE ===== */
  .headline {
    font-size: clamp(2.8rem, 11vw, 5.8rem);
    font-weight: 800;
    line-height: 0.92;
    letter-spacing: -0.045em;
    margin-bottom: 6vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .line-mask {
    display: block;
    overflow: hidden;
    padding: 0.05em 0;
  }
  .line-inner {
    display: block;
    transform: translateY(110%);
    will-change: transform;
  }
  .headline .line-1 .line-inner { animation: revealUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.9s forwards; }
  .headline .line-2 .line-inner { animation: revealUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) 1.05s forwards; }
  @keyframes revealUp {
    to { transform: translateY(0); }
  }

  /* ===== VS ROW ===== */
  .vs-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 4vw;
    margin-bottom: 7vh;
    width: 100%;
    max-width: 600px;
    opacity: 0;
    animation: fadeIn 1s ease 1.8s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  .team {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5vh;
    transform: translateY(40px);
    opacity: 0;
  }
  .team-arsenal { animation: teamIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) 1.6s forwards; }
  .team-city { animation: teamIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) 1.75s forwards; }
  @keyframes teamIn { to { opacity: 1; transform: translateY(0); } }

  .crest {
    width: 22vw;
    max-width: 110px;
    height: auto;
    display: block;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .team:hover .crest { transform: scale(1.08); }

  .team-name {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .vs-divider {
    position: relative;
    font-size: clamp(1.4rem, 5vw, 2rem);
    font-weight: 200;
    letter-spacing: 0.1em;
    padding: 0.6em 0.4em;
    color: rgba(255,255,255,0.85);
  }
  .vs-divider::before, .vs-divider::after {
    content: '';
    position: absolute;
    left: 50%;
    width: 1px;
    height: 4vh;
    background: linear-gradient(to bottom, transparent, rgba(212,175,55,0.5), transparent);
    transform: translateX(-50%);
  }
  .vs-divider::before { top: -4vh; }
  .vs-divider::after { bottom: -4vh; }

  /* ===== DATE/TIME ===== */
  .datetime {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.8vh;
  }
  .date-line, .time-line {
    overflow: hidden;
    padding: 0.1em 0;
  }
  .date-line {
    overflow: visible;
  }
  .date-line span {
    display: inline-block;
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    border-right: 2px solid rgba(255, 255, 255, 0.8);
    padding-right: 4px;
    white-space: nowrap;
    animation: blink 0.7s step-end infinite;
  }
  @keyframes blink {
    from, to { border-color: rgba(255, 255, 255, 0.8); }
    50% { border-color: transparent; }
  }
  .time-line span {
    display: block;
    font-size: clamp(2.2rem, 9vw, 3.6rem);
    font-weight: 200;
    letter-spacing: 0.04em;
    transform: translateY(110%);
    animation: revealUp 1s cubic-bezier(0.22, 1, 0.36, 1) 2.25s forwards;
    background: linear-gradient(180deg, #ffffff 0%, #b8b8b8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .timezone {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    opacity: 0;
    animation: fadeIn 0.8s ease 2.7s forwards;
  }

  /* ===== FOOTER ===== */
  .footer {
    position: absolute;
    bottom: 6vh;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 4;
    opacity: 0;
    animation: fadeIn 1.2s ease 3.2s forwards;
  }
  .footer-line {
    width: 40px;
    height: 1px;
    background: rgba(212,175,55,0.5);
    margin: 0 auto 1.5vh;
  }
  .footer-text {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }

  /* ===== REPLAY BUTTON ===== */
  .replay {
    position: absolute;
    top: 3vh;
    right: 4vw;
    z-index: 10;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: rgba(255,255,255,0.7);
    padding: 0.8vh 2.5vw;
    font-family: inherit;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0;
    animation: fadeIn 0.6s ease 3.5s forwards;
    transition: all 0.3s ease;
  }
  .replay:hover {
    background: rgba(255,255,255,0.12);
    color: #fff;
    transform: scale(1.05);
  }
  .replay:active { transform: scale(0.98); }

  /* Subtle continuous pulse on the central golden glow */
  .scene::after {
    content: '';
    position: absolute;
    width: 1px;
    height: 1px;
    background: rgba(212,175,55,0.15);
    box-shadow: 0 0 80px 60px rgba(212,175,55,0.08);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: -1;
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .line-inner, .team, .eyebrow, .datetime span, .footer, .replay, .emblem-wrap {
      transform: none !important;
      opacity: 1 !important;
    }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <!-- Ambient backgrounds -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="vignette"></div>
    <div class="grain"></div>

    <!-- Replay control -->
    <button class="replay" id="replay" aria-label="Replay animation"></button>

    <!-- Main scene -->
    <main class="scene">
      <!-- Shield emblem -->
      <div class="emblem-wrap">
        <svg class="emblem" viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg" fill="none">
          <path d="M50 2 L96 16 V56 C96 86 76 104 50 108 C24 104 4 86 4 56 V16 Z" stroke="#d4af37" stroke-width="1.8" fill="rgba(212,175,55,0.04)"/>
          <path d="M50 8 L90 20 V56 C90 82 73 98 50 102 C27 98 10 82 10 56 V20 Z" stroke="#d4af37" stroke-width="0.6" opacity="0.5"/>
          <circle cx="50" cy="52" r="14" stroke="#d4af37" stroke-width="1.2" fill="none"/>
          <text x="50" y="58" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#d4af37" letter-spacing="0.5">FA</text>
        </svg>
      </div>

      <!-- Eyebrow -->
      <p class="eyebrow">The Season Opener</p>

      <!-- Headline -->
      <h1 class="headline">
        <span class="line-mask line-1"><span class="line-inner">FA Community</span></span>
        <span class="line-mask line-2"><span class="line-inner">Shield 2026</span></span>
      </h1>

      <!-- Teams -->
      <div class="vs-row">
        <div class="team team-arsenal">
          <!-- Arsenal cannon crest (simplified iconic mark) -->
          <svg class="crest" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="arsenalBg" cx="50%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#ef0107"/>
                <stop offset="100%" stop-color="#9c0004"/>
              </radialGradient>
            </defs>
            <circle cx="50" cy="50" r="48" fill="url(#arsenalBg)" stroke="#fff" stroke-width="3"/>
            <circle cx="50" cy="50" r="42" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
            <!-- Cannon silhouette -->
            <g transform="translate(50,50)">
              <rect x="-22" y="-4" width="34" height="8" fill="#fff" rx="1"/>
              <rect x="-26" y="-7" width="6" height="14" fill="#fff" rx="1"/>
              <circle cx="14" cy="0" r="5" fill="none" stroke="#fff" stroke-width="2.5"/>
              <rect x="-22" y="4" width="4" height="6" fill="#fff"/>
              <rect x="-14" y="4" width="4" height="6" fill="#fff"/>
              <rect x="-6" y="4" width="4" height="6" fill="#fff"/>
              <rect x="2" y="4" width="4" height="6" fill="#fff"/>
            </g>
          </svg>
          <span class="team-name">Arsenal</span>
        </div>

        <div class="vs-divider">VS</div>

        <div class="team team-city">
          <!-- Manchester City crest (simplified iconic mark) -->
          <svg class="crest" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="cityBg" cx="50%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#6cabdd"/>
                <stop offset="100%" stop-color="#1c4e80"/>
              </radialGradient>
            </defs>
            <circle cx="50" cy="50" r="48" fill="url(#cityBg)" stroke="#fff" stroke-width="3"/>
            <circle cx="50" cy="50" r="42" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
            <!-- Shield with ship (simplified) -->
            <g transform="translate(50,50)">
              <path d="M -22 -12 L 22 -12 L 22 8 C 22 16 12 22 0 22 C -12 22 -22 16 -22 8 Z" fill="#fff"/>
              <!-- Ship body -->
              <path d="M -14 4 L 14 4 L 11 10 L -11 10 Z" fill="#6cabdd"/>
              <!-- Mast -->
              <line x1="0" y1="-8" x2="0" y2="4" stroke="#6cabdd" stroke-width="1.5"/>
              <!-- sail -->
              <path d="M 0 -6 L 7 0 L 0 0 Z" fill="#6cabdd"/>
              <path d="M 0 -6 L -7 0 L 0 0 Z" fill="#6cabdd"/>
              <!-- waves -->
              <path d="M -16 8 Q -12 6 -8 8 T 0 8 T 8 8 T 16 8" stroke="#6cabdd" stroke-width="1" fill="none"/>
            </g>
            <!-- Three stars on top -->
            <circle cx="38" cy="20" r="1.5" fill="#fff"/>
            <circle cx="50" cy="18" r="1.5" fill="#fff"/>
            <circle cx="62" cy="20" r="1.5" fill="#fff"/>
          </svg>
          <span class="team-name">Man City</span>
        </div>
      </div>

      <!-- Date & Time -->
      <div class="datetime">
        <div class="date-line"><span id="typewriter"></span></div>
        <div class="time-line"><span>15:00</span></div>
        <p class="timezone">UK Time</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-line"></div>
      <p class="footer-text">Principality Stadium · Live</p>
    </footer>
  </div>

<script>
  // Replay animation by re-cloning the stage node
  const replayBtn = document.getElementById('replay');
  const stage = document.getElementById('stage');

  replayBtn.addEventListener('click', () => {
    const clone = stage.cloneNode(true);
    stage.parentNode.replaceChild(clone, stage);
    // Re-attach listener
    const newBtn = clone.querySelector('#replay');
    newBtn.addEventListener('click', () => {
      const c2 = clone.cloneNode(true);
      clone.parentNode.replaceChild(c2, clone);
      c2.querySelector('#replay').addEventListener('click', arguments.callee);
    });
  });

  // FPS lock at 30 for matching export requirements
  // (browser will still render at display refresh, but this caps rAF-driven custom logic if added later)
  const targetFPS = 30;
  const frameDuration = 1000 / targetFPS;
  let lastFrame = 0;

  function frameLoop(timestamp) {
    if (timestamp - lastFrame >= frameDuration) {
      lastFrame = timestamp;
      // Hook for any future per-frame logic
    }
    requestAnimationFrame(frameLoop);
  }
  requestAnimationFrame(frameLoop);

  // Typewriter effect for date line
  const typeTarget = document.getElementById('typewriter');
  const typeText = "Sunday 16 August 2026";
  
  setTimeout(() => {
    let charIndex = 0;
    let isDeleting = false;

    function typeLoop() {
      if (!isDeleting) {
        typeTarget.textContent = typeText.substring(0, charIndex + 1);
        charIndex++;
        if (charIndex === typeText.length) {
          setTimeout(() => {
            isDeleting = true;
            typeLoop();
          }, 2000);
          return;
        }
        setTimeout(typeLoop, 100);
      } else {
        typeTarget.textContent = typeText.substring(0, charIndex - 1);
        charIndex--;
        if (charIndex === 0) {
          isDeleting = false;
          setTimeout(typeLoop, 500);
          return;
        }
        setTimeout(typeLoop, 50);
      }
    }
    typeLoop();
  }, 2100);
</script>
</body>
</html>
