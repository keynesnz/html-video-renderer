<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>HTML Video Test</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #scene {
      position: absolute;
      top: 0;
      left: 0;

      width: 1080px;
      height: 1920px;

      overflow: hidden;

      background: #111;
    }

    .box {
      position: absolute;

      width: 300px;
      height: 300px;

      left: 390px;
      top: 810px;

      background: #fff;

      border-radius: 50%;

      transform-origin: center;
    }
  </style>
</head>

<body>

  <div id="scene">
    <div class="box" id="box"></div>
  </div>

  <script>
    const FPS = 30;
    const DURATION = 6;

    window.getInfo = function () {
      return {
        fps: FPS,
        numberOfFrames: FPS * DURATION
      };
    };

    window.seekToFrame = async function (frameNumber) {

      const time =
        frameNumber / FPS;

      const progress =
        time / DURATION;

      /*
       * Move left → right → left.
       */
      const x =
        Math.sin(
          progress * Math.PI * 2
        ) * 300;

      /*
       * Scale animation.
       */
      const scale =
        1 +
        Math.sin(
          progress * Math.PI * 4
        ) * 0.15;

      const box =
        document.getElementById("box");

      box.style.transform =
        `translateX(${x}px) scale(${scale})`;
    };
  </script>

</body>
</html>
