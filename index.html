<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #scene {
      position: relative;

      width: 1080px;
      height: 1920px;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #111,
          #333
        );
    }

    #box {
      position: absolute;

      width: 300px;
      height: 300px;

      left: 390px;
      top: 810px;

      border-radius: 50%;

      background: white;
    }
  </style>
</head>

<body>

<div id="scene">
  <div id="box"></div>
</div>

<script>
  const box =
    document.getElementById("box");

  window.seekToFrame =
    function(frame, time, fps) {

      /*
       * 6 second animation.
       */
      const progress =
        time / 6;

      const x =
        Math.sin(
          progress * Math.PI * 2
        ) * 300;

      const scale =
        1 +
        Math.sin(
          progress * Math.PI * 4
        ) * 0.15;

      box.style.transform =
        `translateX(${x}px) scale(${scale})`;
    };
</script>

</body>
</html>
